name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write
  packages: write

jobs:
  # ------------------------------------------------------------------------------
  # 1. C++ Backend Server build & test check (runs on every push/PR)
  # ------------------------------------------------------------------------------
  build-server:
    name: Build & Test Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev libsqlite3-dev zlib1g-dev protobuf-compiler libprotobuf-dev pkg-config libjsoncpp-dev uuid-dev libwebp-dev

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: Generate Protobuf Files
        run: |
          dart pub global activate protoc_plugin
          chmod +x scripts/generate_proto.sh
          ./scripts/generate_proto.sh

      - name: Configure CMake
        run: cmake -S server -B server/build -DCMAKE_BUILD_TYPE=Release

      - name: Compile Server Binary
        run: cmake --build server/build --parallel $(nproc)

      - name: Run Server Test Suite
        run: ctest --test-dir server/build --output-on-failure

  # ------------------------------------------------------------------------------
  # 1b. C++ Backend Server build & test check on macOS (Apple Clang, ARM64)
  # ------------------------------------------------------------------------------
  build-server-macos:
    name: Build & Test Server (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install System Dependencies
        run: |
          brew install openssl@3 protobuf webp sqlite zlib jsoncpp

      - name: Configure CMake
        run: |
          cmake -S server -B server/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix);$(brew --prefix openssl@3);$(brew --prefix protobuf);$(brew --prefix webp);$(brew --prefix sqlite);$(brew --prefix jsoncpp)"

      - name: Compile Server & Test Suite
        run: cmake --build server/build --parallel $(sysctl -n hw.ncpu)

      - name: Run Server Test Suite
        run: ctest --test-dir server/build --output-on-failure

      - name: Set up Node.js
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'
          cache-dependency-path: server/web/package-lock.json

      - name: Build Web Client Bundle
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          npm --prefix server/web ci
          npm --prefix server/web run build

      - name: Package macOS Release Archive
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist/crowleys-cloud-server-macos-arm64/config
          mkdir -p dist/crowleys-cloud-server-macos-arm64/public
          mkdir -p dist/crowleys-cloud-server-macos-arm64/services
          if [ -f server/build/Release/crowleys_cloud_server ]; then
            cp server/build/Release/crowleys_cloud_server dist/crowleys-cloud-server-macos-arm64/
          elif [ -f server/build/crowleys_cloud_server ]; then
            cp server/build/crowleys_cloud_server dist/crowleys-cloud-server-macos-arm64/
          else
            echo "Error: crowleys_cloud_server does not exist in server/build or server/build/Release!"
            exit 1
          fi
          chmod +x dist/crowleys-cloud-server-macos-arm64/crowleys_cloud_server
          cp server/scripts/macos/run.sh dist/crowleys-cloud-server-macos-arm64/
          chmod +x dist/crowleys-cloud-server-macos-arm64/run.sh
          cp server/scripts/macos/com.crowleyscloud.server.plist dist/crowleys-cloud-server-macos-arm64/services/
          cp server/scripts/macos/README.md dist/crowleys-cloud-server-macos-arm64/services/
          cp -R server/config/. dist/crowleys-cloud-server-macos-arm64/config/
          cp -R server/public/. dist/crowleys-cloud-server-macos-arm64/public/
          tar -czvf crowleys-cloud-server-macos-arm64.tar.gz -C dist/crowleys-cloud-server-macos-arm64 .

      - name: Upload macOS Server Artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: server-macos-arm64
          path: crowleys-cloud-server-macos-arm64.tar.gz
          retention-days: 30

  # ------------------------------------------------------------------------------
  # 1c. C++ Backend Server build & test check on Windows (MSVC 2022, x64)
  # ------------------------------------------------------------------------------
  build-server-windows:
    name: Build & Test Server (Windows)
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg_cache
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Restore vcpkg Binary Cache
        uses: actions/cache/restore@v4
        id: vcpkg-cache
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-${{ runner.os }}-x64-windows-static-${{ hashFiles('server/vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-windows-static-

      - name: Install Dependencies via vcpkg
        run: |
          vcpkg install --x-manifest-root=server --triplet x64-windows-static --host-triplet x64-windows

      - name: Save vcpkg Binary Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-${{ runner.os }}-x64-windows-static-${{ hashFiles('server/vcpkg.json') }}

      - name: Configure CMake
        run: |
          cmake -S server -B server/build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DVCPKG_HOST_TRIPLET=x64-windows

      - name: Compile Server & Test Suite
        run: cmake --build server/build --config Release --parallel

      - name: Run Server Test Suite
        run: ctest --test-dir server/build -C Release --output-on-failure

      - name: Set up Node.js
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'
          cache-dependency-path: server/web/package-lock.json

      - name: Build Web Client Bundle
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          npm --prefix server/web ci
          npm --prefix server/web run build

      - name: Package Windows Release Archive
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/crowleys-cloud-server-windows-x64/config
          New-Item -ItemType Directory -Force -Path dist/crowleys-cloud-server-windows-x64/public
          New-Item -ItemType Directory -Force -Path dist/crowleys-cloud-server-windows-x64/services
          if (Test-Path server/build/Release/crowleys_cloud_server.exe) {
            Copy-Item server/build/Release/crowleys_cloud_server.exe dist/crowleys-cloud-server-windows-x64/
          } elseif (Test-Path server/build/crowleys_cloud_server.exe) {
            Copy-Item server/build/crowleys_cloud_server.exe dist/crowleys-cloud-server-windows-x64/
          } else {
            throw "crowleys_cloud_server.exe not found in server/build/Release or server/build!"
          }
          Copy-Item server/scripts/windows/run.bat dist/crowleys-cloud-server-windows-x64/
          Copy-Item server/scripts/windows/install-service.bat dist/crowleys-cloud-server-windows-x64/services/
          Copy-Item server/scripts/windows/README.md dist/crowleys-cloud-server-windows-x64/services/
          Copy-Item server/config/* dist/crowleys-cloud-server-windows-x64/config/ -Recurse -Force
          Copy-Item server/public/* dist/crowleys-cloud-server-windows-x64/public/ -Recurse -Force
          $distDir = (Resolve-Path "dist/crowleys-cloud-server-windows-x64").Path
          $zipPath = Join-Path $PWD "crowleys-cloud-server-windows-x64.zip"
          Push-Location $distDir
          Compress-Archive -Force -Path * -DestinationPath $zipPath
          Pop-Location

      - name: Upload Windows Server Artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: server-windows-x64
          path: crowleys-cloud-server-windows-x64.zip
          retention-days: 30

  # ------------------------------------------------------------------------------
  # 2. Web Frontend Build & Verification (runs on every push/PR)
  # ------------------------------------------------------------------------------
  test-web:
    name: Build & Verify Web Client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'
          cache-dependency-path: server/web/package-lock.json

      - name: Install Dependencies
        working-directory: server/web
        run: npm ci

      - name: Verify Localization Keys
        working-directory: server/web
        run: npm run check:i18n

      - name: Build Web Client Bundle
        working-directory: server/web
        run: npm run build

      - name: Package Web Client Bundle
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          tar -czvf "crowleys-cloud-web-${VERSION}.tar.gz" -C server public

      - name: Upload Web Client Artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: web-bundle
          path: crowleys-cloud-web-*.tar.gz
          retention-days: 30

  # ------------------------------------------------------------------------------
  # 3. Flutter Mobile Application Verification (runs on every push/PR)
  # ------------------------------------------------------------------------------
  test-client:
    name: Test & Analyze Client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Dart SDK (to activate protoc_plugin)
        uses: dart-lang/setup-dart@v1

      - name: Install Protobuf Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Generate Protobuf Files
        run: |
          dart pub global activate protoc_plugin
          chmod +x scripts/generate_proto.sh
          ./scripts/generate_proto.sh

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Unit & Widget Tests
        run: flutter test

  # ------------------------------------------------------------------------------
  # 3. Android APK Release Build (runs ONLY on version tag push)
  # ------------------------------------------------------------------------------
  build-android:
    name: Build Android APK
    needs: test-client
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Dart SDK (to activate protoc_plugin)
        uses: dart-lang/setup-dart@v1

      - name: Install Protobuf Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Generate Protobuf Files
        run: |
          dart pub global activate protoc_plugin
          chmod +x scripts/generate_proto.sh
          ./scripts/generate_proto.sh

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # ------------------------------------------------------------------------------
  # 4. iOS App Release Build (runs ONLY on version tag push)
  # ------------------------------------------------------------------------------
  build-ios:
    name: Build iOS App
    needs: test-client
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Dart SDK (to activate protoc_plugin)
        uses: dart-lang/setup-dart@v1

      - name: Install Protobuf Compiler
        run: brew install protobuf

      - name: Generate Protobuf Files
        run: |
          dart pub global activate protoc_plugin
          chmod +x scripts/generate_proto.sh
          ./scripts/generate_proto.sh

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Download iOS Build Artifacts
        run: flutter precache --ios

      - name: Prepare iOS Workspace (No Code Sign)
        run: flutter build ios --no-codesign

  # ------------------------------------------------------------------------------
  # 5. Build Server Docker Images natively per architecture (runs ONLY on version tag push)
  # ------------------------------------------------------------------------------
  build-docker-image:
    name: Docker (${{ matrix.arch }})
    needs: build-server
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-26.04-arm
            platform: linux/arm64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name for GHCR
        run: |
          echo "REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and Push Single-Arch Image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ env.REPO_LOWER }}/crowleys-cloud-server,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max,ignore-error=true

      - name: Export Digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload Digest
        uses: actions/upload-artifact@v7
        with:
          name: docker-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  # ------------------------------------------------------------------------------
  # 6. Merge per-arch images into a single multi-arch manifest
  # ------------------------------------------------------------------------------
  merge-docker-manifest:
    name: Publish Multi-Arch Manifest
    needs: build-docker-image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name for GHCR
        run: |
          echo "REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Download All Digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: docker-digest-*
          merge-multiple: true

      - name: Determine Tags
        id: tags
        run: |
          IMAGE="ghcr.io/${{ env.REPO_LOWER }}/crowleys-cloud-server"
          VERSION="${GITHUB_REF#refs/tags/}"
          TAGS="${IMAGE}:latest,${IMAGE}:${VERSION},${IMAGE}:${{ github.sha }}"
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Create and Push Multi-Arch Manifest
        working-directory: /tmp/digests
        run: |
          IMAGE="ghcr.io/${{ env.REPO_LOWER }}/crowleys-cloud-server"
          TAG_ARGS=""
          IFS=',' read -ra TAG_LIST <<< "${{ steps.tags.outputs.tags }}"
          for tag in "${TAG_LIST[@]}"; do
            TAG_ARGS="${TAG_ARGS} -t ${tag}"
          done
          docker buildx imagetools create ${TAG_ARGS} \
            $(printf "${IMAGE}@sha256:%s " *)

  # ------------------------------------------------------------------------------
  # 7. Create GitHub Release with APK and Web Client (triggers only on version tags)
  # ------------------------------------------------------------------------------
  create-release:
    name: Publish GitHub Release
    needs: [build-server, build-server-macos, build-server-windows, test-web, build-android, build-ios, merge-docker-manifest]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download APK Artifact
        uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: .

      - name: Download Web Bundle Artifact
        uses: actions/download-artifact@v8
        with:
          name: web-bundle
          path: .

      - name: Download Windows Server Artifact
        uses: actions/download-artifact@v8
        with:
          name: server-windows-x64
          path: .

      - name: Download macOS Server Artifact
        uses: actions/download-artifact@v8
        with:
          name: server-macos-arm64
          path: .

      - name: Rename APK with Version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          mv app-release.apk "crowleys-cloud-${VERSION}.apk"
          echo "APK_NAME=crowleys-cloud-${VERSION}.apk" >> $GITHUB_ENV

      - name: Generate Release Notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "## What's Changed" > release_notes.md
          echo "" >> release_notes.md
          if [ -n "$PREV_TAG" ]; then
            git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges >> release_notes.md
          else
            git log --pretty=format:"- %s" --no-merges -20 >> release_notes.md
          fi
          echo "" >> release_notes.md
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "### macOS Server" >> release_notes.md
          echo "Download \`crowleys-cloud-server-macos-arm64.tar.gz\`, extract, and execute \`./run.sh\`." >> release_notes.md
          echo "" >> release_notes.md
          echo "### Windows Server" >> release_notes.md
          echo "Download \`crowleys-cloud-server-windows-x64.zip\`, extract, and double-click \`run.bat\`." >> release_notes.md
          echo "" >> release_notes.md
          echo "### Android App" >> release_notes.md
          echo "Download the APK file below and install it on your Android device." >> release_notes.md
          echo "" >> release_notes.md
          echo "### Web Client" >> release_notes.md
          echo "Standalone web client assets are attached as \`crowleys-cloud-web-${GITHUB_REF#refs/tags/v}.tar.gz\` (extract into \`public/\`)." >> release_notes.md
          echo "" >> release_notes.md
          echo "### Server Docker Image" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "docker pull ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/crowleys-cloud-server:${GITHUB_REF#refs/tags/}" >> release_notes.md
          echo '```' >> release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          files: |
            ${{ env.APK_NAME }}
            crowleys-cloud-web-*.tar.gz
            crowleys-cloud-server-windows-x64.zip
            crowleys-cloud-server-macos-arm64.tar.gz
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-rc') || contains(github.ref, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
