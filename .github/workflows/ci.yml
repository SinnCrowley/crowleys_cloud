name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  packages: write

jobs:
  # ------------------------------------------------------------------------------
  # 1. C++ Backend Server build and test check
  # ------------------------------------------------------------------------------
  build-server:
    name: Build & Test Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev libsqlite3-dev zlib1g-dev protobuf-compiler libprotobuf-dev pkg-config libjsoncpp-dev uuid-dev

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: Generate Protobuf Files
        run: |
          dart pub global activate protoc_plugin
          chmod +x scripts/generate_proto.sh
          ./scripts/generate_proto.sh

      - name: Configure CMake
        run: cmake -S server -B server/build -DCMAKE_BUILD_TYPE=Release

      - name: Compile Server Binary
        run: cmake --build server/build --parallel $(nproc)

  # ------------------------------------------------------------------------------
  # 2. Flutter Mobile Application Verification & Compilation
  # ------------------------------------------------------------------------------
  test-client:
    name: Test & Analyze Client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Dart SDK (to activate protoc_plugin)
        uses: dart-lang/setup-dart@v1

      - name: Install Protobuf Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Generate Protobuf Files
        run: |
          dart pub global activate protoc_plugin
          chmod +x scripts/generate_proto.sh
          ./scripts/generate_proto.sh

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Unit & Widget Tests
        run: flutter test

  build-android:
    name: Build Android APK
    needs: test-client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Dart SDK (to activate protoc_plugin)
        uses: dart-lang/setup-dart@v1

      - name: Install Protobuf Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Generate Protobuf Files
        run: |
          dart pub global activate protoc_plugin
          chmod +x scripts/generate_proto.sh
          ./scripts/generate_proto.sh

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

  build-ios:
    name: Build iOS App
    needs: test-client
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Dart SDK (to activate protoc_plugin)
        uses: dart-lang/setup-dart@v1

      - name: Install Protobuf Compiler
        run: brew install protobuf

      - name: Generate Protobuf Files
        run: |
          dart pub global activate protoc_plugin
          chmod +x scripts/generate_proto.sh
          ./scripts/generate_proto.sh

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Download iOS Build Artifacts
        run: flutter precache --ios

      - name: Prepare iOS Workspace (No Code Sign)
        run: flutter build ios --no-codesign

  # ------------------------------------------------------------------------------
  # 3. Publish Server Docker Container (triggers only on push/merge to main)
  # ------------------------------------------------------------------------------
  publish-server-image:
    name: Build & Push Docker Image
    needs: [build-server, build-android, build-ios]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU (Multi-platform emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name for GHCR
        run: |
          echo "REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and Push Multi-Arch Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/crowleys-cloud-server:latest
            ghcr.io/${{ env.REPO_LOWER }}/crowleys-cloud-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
