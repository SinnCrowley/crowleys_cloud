name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write
  packages: write

jobs:
  # ------------------------------------------------------------------------------
  # 1. C++ Backend Server build & test check (runs on every push/PR)
  # ------------------------------------------------------------------------------
  build-server:
    name: Build & Test Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev libsqlite3-dev zlib1g-dev protobuf-compiler libprotobuf-dev pkg-config libjsoncpp-dev uuid-dev

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: Generate Protobuf Files
        run: |
          dart pub global activate protoc_plugin
          chmod +x scripts/generate_proto.sh
          ./scripts/generate_proto.sh

      - name: Configure CMake
        run: cmake -S server -B server/build -DCMAKE_BUILD_TYPE=Release

      - name: Compile Server Binary
        run: cmake --build server/build --parallel $(nproc)

  # ------------------------------------------------------------------------------
  # 2. Web Frontend Build & Verification (runs on every push/PR)
  # ------------------------------------------------------------------------------
  test-web:
    name: Build & Verify Web Client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: server/web/package-lock.json

      - name: Install Dependencies
        working-directory: server/web
        run: npm ci

      - name: Verify Localization Keys
        working-directory: server/web
        run: npm run check:i18n

      - name: Build Web Client Bundle
        working-directory: server/web
        run: npm run build

      - name: Package Web Client Bundle
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          tar -czvf "crowleys-cloud-web-${VERSION}.tar.gz" -C server public

      - name: Upload Web Client Artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: crowleys-cloud-web-*.tar.gz
          retention-days: 30

  # ------------------------------------------------------------------------------
  # 3. Flutter Mobile Application Verification (runs on every push/PR)
  # ------------------------------------------------------------------------------
  test-client:
    name: Test & Analyze Client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Dart SDK (to activate protoc_plugin)
        uses: dart-lang/setup-dart@v1

      - name: Install Protobuf Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Generate Protobuf Files
        run: |
          dart pub global activate protoc_plugin
          chmod +x scripts/generate_proto.sh
          ./scripts/generate_proto.sh

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Unit & Widget Tests
        run: flutter test

  # ------------------------------------------------------------------------------
  # 3. Android APK Release Build (runs ONLY on version tag push)
  # ------------------------------------------------------------------------------
  build-android:
    name: Build Android APK
    needs: test-client
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Dart SDK (to activate protoc_plugin)
        uses: dart-lang/setup-dart@v1

      - name: Install Protobuf Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Generate Protobuf Files
        run: |
          dart pub global activate protoc_plugin
          chmod +x scripts/generate_proto.sh
          ./scripts/generate_proto.sh

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # ------------------------------------------------------------------------------
  # 4. iOS App Release Build (runs ONLY on version tag push)
  # ------------------------------------------------------------------------------
  build-ios:
    name: Build iOS App
    needs: test-client
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Dart SDK (to activate protoc_plugin)
        uses: dart-lang/setup-dart@v1

      - name: Install Protobuf Compiler
        run: brew install protobuf

      - name: Generate Protobuf Files
        run: |
          dart pub global activate protoc_plugin
          chmod +x scripts/generate_proto.sh
          ./scripts/generate_proto.sh

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Download iOS Build Artifacts
        run: flutter precache --ios

      - name: Prepare iOS Workspace (No Code Sign)
        run: flutter build ios --no-codesign

  # ------------------------------------------------------------------------------
  # 5. Build Server Docker Images natively per architecture (runs ONLY on version tag push)
  # ------------------------------------------------------------------------------
  build-docker-image:
    name: Docker (${{ matrix.arch }})
    needs: build-server
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name for GHCR
        run: |
          echo "REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and Push Single-Arch Image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ env.REPO_LOWER }}/crowleys-cloud-server,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max,ignore-error=true

      - name: Export Digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload Digest
        uses: actions/upload-artifact@v7
        with:
          name: docker-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  # ------------------------------------------------------------------------------
  # 6. Merge per-arch images into a single multi-arch manifest
  # ------------------------------------------------------------------------------
  merge-docker-manifest:
    name: Publish Multi-Arch Manifest
    needs: build-docker-image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name for GHCR
        run: |
          echo "REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Download All Digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: docker-digest-*
          merge-multiple: true

      - name: Determine Tags
        id: tags
        run: |
          IMAGE="ghcr.io/${{ env.REPO_LOWER }}/crowleys-cloud-server"
          VERSION="${GITHUB_REF#refs/tags/}"
          TAGS="${IMAGE}:latest,${IMAGE}:${VERSION},${IMAGE}:${{ github.sha }}"
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Create and Push Multi-Arch Manifest
        working-directory: /tmp/digests
        run: |
          IMAGE="ghcr.io/${{ env.REPO_LOWER }}/crowleys-cloud-server"
          TAG_ARGS=""
          IFS=',' read -ra TAG_LIST <<< "${{ steps.tags.outputs.tags }}"
          for tag in "${TAG_LIST[@]}"; do
            TAG_ARGS="${TAG_ARGS} -t ${tag}"
          done
          docker buildx imagetools create ${TAG_ARGS} \
            $(printf "${IMAGE}@sha256:%s " *)

  # ------------------------------------------------------------------------------
  # 7. Create GitHub Release with APK and Web Client (triggers only on version tags)
  # ------------------------------------------------------------------------------
  create-release:
    name: Publish GitHub Release
    needs: [build-server, test-web, build-android, build-ios, merge-docker-manifest]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download APK Artifact
        uses: actions/download-artifact@v8
        with:
          name: android-apk

      - name: Download Web Bundle Artifact
        uses: actions/download-artifact@v8
        with:
          name: web-bundle

      - name: Rename APK with Version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          mv app-release.apk "crowleys-cloud-${VERSION}.apk"
          echo "APK_NAME=crowleys-cloud-${VERSION}.apk" >> $GITHUB_ENV

      - name: Generate Release Notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "## What's Changed" > release_notes.md
          echo "" >> release_notes.md
          if [ -n "$PREV_TAG" ]; then
            git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges >> release_notes.md
          else
            git log --pretty=format:"- %s" --no-merges -20 >> release_notes.md
          fi
          echo "" >> release_notes.md
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "### Android App" >> release_notes.md
          echo "Download the APK file below and install it on your Android device." >> release_notes.md
          echo "" >> release_notes.md
          echo "### Web Client" >> release_notes.md
          echo "Standalone web client assets are attached as \`crowleys-cloud-web-${GITHUB_REF#refs/tags/v}.tar.gz\` (extract into \`public/\`)." >> release_notes.md
          echo "" >> release_notes.md
          echo "### Server Docker Image" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "docker pull ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/crowleys-cloud-server:${GITHUB_REF#refs/tags/}" >> release_notes.md
          echo '```' >> release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          files: |
            ${{ env.APK_NAME }}
            crowleys-cloud-web-*.tar.gz
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-rc') || contains(github.ref, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
