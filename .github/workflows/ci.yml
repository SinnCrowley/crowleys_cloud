name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------------------
  # Path filtering to detect changed components
  # ------------------------------------------------------------------------------
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      server: ${{ steps.filter.outputs.server }}
      web: ${{ steps.filter.outputs.web }}
      client: ${{ steps.filter.outputs.client }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Path Filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            server:
              - 'server/**'
              - '!server/web/**'
              - '!server/README.md'
              - 'proto/**'
              - '.github/workflows/ci.yml'
            web:
              - 'server/web/**'
              - 'tool/**'
              - '.github/workflows/ci.yml'
            client:
              - 'lib/**'
              - 'test/**'
              - 'android/**'
              - 'ios/**'
              - 'assets/**'
              - 'proto/**'
              - 'scripts/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'analysis_options.yaml'
              - 'l10n.yaml'
              - '.github/workflows/ci.yml'

  # ------------------------------------------------------------------------------
  # 1. C++ Backend Server build & test check (runs on changes / tags / dispatch)
  # Fast Linux x64 server validation
  # ------------------------------------------------------------------------------
  build-server:
    name: Build & Test Server
    needs: changes
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev libsqlite3-dev zlib1g-dev protobuf-compiler libprotobuf-dev pkg-config libjsoncpp-dev uuid-dev libwebp-dev ccache

      - name: Configure ccache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-linux-${{ hashFiles('server/CMakeLists.txt', 'server/vcpkg.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-linux-${{ hashFiles('server/CMakeLists.txt', 'server/vcpkg.json') }}-
            ccache-linux-

      - name: Zero ccache statistics
        run: ccache -z

      - name: Configure CMake
        run: |
          cmake -S server -B server/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Compile Server Binary
        run: cmake --build server/build --parallel $(nproc)

      - name: Show ccache statistics
        if: always()
        run: ccache -s

      - name: Run Server Test Suite
        run: ctest --test-dir server/build --output-on-failure

  # ------------------------------------------------------------------------------
  # 1b. C++ Backend Server build & test check on macOS (Apple Clang, ARM64)
  # Reserved strictly for release tags (v*) and manual workflow_dispatch
  # ------------------------------------------------------------------------------
  build-server-macos:
    name: Build & Test Server (macOS)
    needs: test-web
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install System Dependencies
        run: |
          brew install openssl@3 protobuf webp sqlite zlib jsoncpp ccache

      - name: Configure ccache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-macos-${{ hashFiles('server/CMakeLists.txt', 'server/vcpkg.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-macos-${{ hashFiles('server/CMakeLists.txt', 'server/vcpkg.json') }}-
            ccache-macos-

      - name: Zero ccache statistics
        run: ccache -z

      - name: Configure CMake
        run: |
          cmake -S server -B server/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_PREFIX_PATH="$(brew --prefix);$(brew --prefix openssl@3);$(brew --prefix protobuf);$(brew --prefix webp);$(brew --prefix sqlite);$(brew --prefix jsoncpp)"

      - name: Compile Server & Test Suite
        run: cmake --build server/build --parallel $(sysctl -n hw.ncpu)

      - name: Show ccache statistics
        if: always()
        run: ccache -s

      - name: Run Server Test Suite
        run: ctest --test-dir server/build --output-on-failure

      - name: Download Web Client Bundle
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v8
        with:
          name: web-static-assets
          path: server/public

      - name: Package macOS Release Archive
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p dist/crowleys-cloud-server-macos-arm64/config
          mkdir -p dist/crowleys-cloud-server-macos-arm64/public
          mkdir -p dist/crowleys-cloud-server-macos-arm64/services
          if [ -f server/build/Release/crowleys_cloud_server ]; then
            cp server/build/Release/crowleys_cloud_server dist/crowleys-cloud-server-macos-arm64/
          elif [ -f server/build/crowleys_cloud_server ]; then
            cp server/build/crowleys_cloud_server dist/crowleys-cloud-server-macos-arm64/
          else
            echo "Error: crowleys_cloud_server does not exist in server/build or server/build/Release!"
            exit 1
          fi
          chmod +x dist/crowleys-cloud-server-macos-arm64/crowleys_cloud_server
          cp server/scripts/macos/run.sh dist/crowleys-cloud-server-macos-arm64/
          chmod +x dist/crowleys-cloud-server-macos-arm64/run.sh
          cp server/scripts/macos/com.crowleyscloud.server.plist dist/crowleys-cloud-server-macos-arm64/services/
          cp server/scripts/macos/README.md server/scripts/macos/install-agent.sh dist/crowleys-cloud-server-macos-arm64/services/
          cp server/config/config.json server/config/config.local.example.json dist/crowleys-cloud-server-macos-arm64/config/
          cp -R server/public/. dist/crowleys-cloud-server-macos-arm64/public/
          cmake -DEXECUTABLE="$PWD/dist/crowleys-cloud-server-macos-arm64/crowleys_cloud_server" -P server/cmake/BundleMacOS.cmake
          tar -czvf crowleys-cloud-server-macos-arm64.tar.gz -C dist/crowleys-cloud-server-macos-arm64 .

      - name: Test Packaged macOS Server
        run: |
          mkdir -p "$RUNNER_TEMP/macOS release"
          tar -xzf crowleys-cloud-server-macos-arm64.tar.gz -C "$RUNNER_TEMP/macOS release"
          python3 server/test/release_smoke_test.py "$RUNNER_TEMP/macOS release"

      - name: Upload macOS Server Artifact
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: server-macos-arm64
          path: crowleys-cloud-server-macos-arm64.tar.gz
          retention-days: 30

  # ------------------------------------------------------------------------------
  # 1c. C++ Backend Server build & test check on Windows (x64 and ARM64)
  # Reserved strictly for release tags (v*) and manual workflow_dispatch
  # ------------------------------------------------------------------------------
  build-server-windows:
    name: Build & Test Server (Windows ${{ matrix.arch }})
    needs: test-web
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            triplet: x64-windows-static
            host_triplet: x64-windows
            cmake_arch: x64
          - arch: arm64
            runner: windows-11-arm
            triplet: arm64-windows-static
            host_triplet: arm64-windows
            cmake_arch: ARM64
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg_cache
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Restore vcpkg Binary Cache
        uses: actions/cache/restore@v6
        id: vcpkg-cache
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-${{ runner.os }}-${{ matrix.triplet }}-${{ hashFiles('server/vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.triplet }}-

      - name: Create vcpkg Cache Directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/vcpkg_cache" | Out-Null

      - name: Install Dependencies via vcpkg
        run: |
          vcpkg install --x-manifest-root=server --triplet ${{ matrix.triplet }} --host-triplet ${{ matrix.host_triplet }}

      - name: Save vcpkg Binary Cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-${{ runner.os }}-${{ matrix.triplet }}-${{ hashFiles('server/vcpkg.json') }}

      - name: Configure CMake
        run: |
          cmake -S server -B server/build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} `
            -DVCPKG_HOST_TRIPLET=${{ matrix.host_triplet }} `
            -A ${{ matrix.cmake_arch }}

      - name: Compile Server & Test Suite
        run: cmake --build server/build --config Release --parallel

      - name: Run Server Test Suite
        run: ctest --test-dir server/build -C Release --output-on-failure

      - name: Download Web Client Bundle
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v8
        with:
          name: web-static-assets
          path: server/public

      - name: Package Windows Release Archive
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $distName = "crowleys-cloud-server-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path "dist/$distName/config"
          New-Item -ItemType Directory -Force -Path "dist/$distName/public"
          New-Item -ItemType Directory -Force -Path "dist/$distName/services"
          if (Test-Path server/build/Release/crowleys_cloud_server.exe) {
            Copy-Item server/build/Release/crowleys_cloud_server.exe "dist/$distName/"
          } elseif (Test-Path server/build/crowleys_cloud_server.exe) {
            Copy-Item server/build/crowleys_cloud_server.exe "dist/$distName/"
          } else {
            throw "crowleys_cloud_server.exe not found in server/build/Release or server/build!"
          }
          Copy-Item server/scripts/windows/run.bat "dist/$distName/"
          Copy-Item server/scripts/windows/install-service.bat "dist/$distName/services/"
          Copy-Item server/scripts/windows/README.md "dist/$distName/services/"
          Copy-Item server/config/config.json,server/config/config.local.example.json "dist/$distName/config/" -Force
          Copy-Item server/public/* "dist/$distName/public/" -Recurse -Force
          $distDir = (Resolve-Path "dist/$distName").Path
          $zipPath = Join-Path $PWD "$distName.zip"
          Push-Location $distDir
          Compress-Archive -Force -Path * -DestinationPath $zipPath
          Pop-Location

      - name: Test Packaged Windows Server
        shell: pwsh
        run: |
          $archive = "crowleys-cloud-server-windows-${{ matrix.arch }}.zip"
          $destination = Join-Path $env:RUNNER_TEMP "Windows release"
          Expand-Archive -Path $archive -DestinationPath $destination
          python server/test/release_smoke_test.py $destination

      - name: Upload Windows Server Artifact
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: server-windows-${{ matrix.arch }}
          path: crowleys-cloud-server-windows-${{ matrix.arch }}.zip
          retention-days: 30

  # ------------------------------------------------------------------------------
  # 2. Web Frontend Build & Verification (runs on changes / tags / dispatch)
  # ------------------------------------------------------------------------------
  test-web:
    name: Build & Verify Web Client
    needs: changes
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'
          cache-dependency-path: server/web/package-lock.json

      - name: Install Dependencies
        working-directory: server/web
        run: npm ci

      - name: Verify Localization Keys
        working-directory: server/web
        run: npm run check:i18n

      - name: Test Web Client
        working-directory: server/web
        run: npm test

      - name: Build Web Client Bundle
        working-directory: server/web
        run: npm run build

      - name: Package Web Client Release Archive
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          tar -czvf "crowleys-cloud-web-${VERSION}.tar.gz" -C server public

      - name: Upload Web Client Release Archive
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: web-bundle
          path: crowleys-cloud-web-*.tar.gz
          retention-days: 30

      - name: Upload Web Static Assets
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: web-static-assets
          path: server/public/
          retention-days: 1

  # ------------------------------------------------------------------------------
  # 3. Flutter Mobile Application Verification (runs on changes / tags / dispatch)
  # ------------------------------------------------------------------------------
  test-client:
    name: Test & Analyze Client
    needs: changes
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Protobuf Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Generate Protobuf Files
        run: |
          chmod +x scripts/generate_proto.sh
          ./scripts/generate_proto.sh

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Unit & Widget Tests
        run: flutter test

  # ------------------------------------------------------------------------------
  # 4. CI Status Gate (runs on every push/PR)
  # Ensures status checks pass reliably without hanging when jobs are skipped.
  # ------------------------------------------------------------------------------
  ci-gate:
    name: CI Status Gate
    if: always()
    needs: [changes, build-server, test-web, test-client]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate status check results
        run: |
          echo "Changes: ${{ needs.changes.result }}"
          echo "build-server: ${{ needs.build-server.result }}"
          echo "test-web: ${{ needs.test-web.result }}"
          echo "test-client: ${{ needs.test-client.result }}"

          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Error: Changes detection failed or was cancelled."
            exit 1
          fi

          for result in "${{ needs.build-server.result }}" "${{ needs.test-web.result }}" "${{ needs.test-client.result }}"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "Error: One or more required validation jobs failed or were cancelled."
              exit 1
            fi
          done

          echo "All validation checks passed or were safely skipped."

  # ------------------------------------------------------------------------------
  # 5. Android APK Release Build (runs ONLY on version tag push)
  # ------------------------------------------------------------------------------
  build-android:
    name: Build Android APK
    needs: test-client
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Protobuf Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Generate Protobuf Files
        run: |
          chmod +x scripts/generate_proto.sh
          ./scripts/generate_proto.sh

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 release secret"; exit 1; }
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.jks"

      - name: Build Android Release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # ------------------------------------------------------------------------------
  # 6. iOS App Release Build (runs ONLY on version tag push)
  # ------------------------------------------------------------------------------
  build-ios:
    name: Build iOS App
    needs: test-client
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Protobuf Compiler
        run: brew install protobuf

      - name: Generate Protobuf Files
        run: |
          chmod +x scripts/generate_proto.sh
          ./scripts/generate_proto.sh

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Download iOS Build Artifacts
        run: flutter precache --ios

      - name: Prepare iOS Workspace (No Code Sign)
        run: flutter build ios --no-codesign

  # ------------------------------------------------------------------------------
  # 7. Build Server Docker Images natively per architecture (runs ONLY on version tag push)
  # ------------------------------------------------------------------------------
  build-docker-image:
    name: Docker (${{ matrix.arch }})
    needs: build-server
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-26.04-arm
            platform: linux/arm64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name for GHCR
        run: |
          echo "REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and Push Single-Arch Image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ env.REPO_LOWER }}/crowleys-cloud-server,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max,ignore-error=true

      - name: Export Digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload Digest
        uses: actions/upload-artifact@v7
        with:
          name: docker-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  # ------------------------------------------------------------------------------
  # 8. Merge per-arch images into a single multi-arch manifest
  # ------------------------------------------------------------------------------
  merge-docker-manifest:
    name: Publish Multi-Arch Manifest
    needs: build-docker-image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name for GHCR
        run: |
          echo "REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Download All Digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: docker-digest-*
          merge-multiple: true

      - name: Determine Tags
        id: tags
        run: |
          IMAGE="ghcr.io/${{ env.REPO_LOWER }}/crowleys-cloud-server"
          VERSION="${GITHUB_REF#refs/tags/}"
          TAGS="${IMAGE}:latest,${IMAGE}:${VERSION},${IMAGE}:${{ github.sha }}"
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Create and Push Multi-Arch Manifest
        working-directory: /tmp/digests
        run: |
          IMAGE="ghcr.io/${{ env.REPO_LOWER }}/crowleys-cloud-server"
          TAG_ARGS=""
          IFS=',' read -ra TAG_LIST <<< "${{ steps.tags.outputs.tags }}"
          for tag in "${TAG_LIST[@]}"; do
            TAG_ARGS="${TAG_ARGS} -t ${tag}"
          done
          docker buildx imagetools create ${TAG_ARGS} \
            $(printf "${IMAGE}@sha256:%s " *)

  # ------------------------------------------------------------------------------
  # 9. Create GitHub Release with APK and Web Client (triggers only on version tags)
  # ------------------------------------------------------------------------------
  create-release:
    name: Publish GitHub Release
    needs: [build-server, build-server-macos, build-server-windows, test-web, build-android, build-ios, merge-docker-manifest]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download APK Artifact
        uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: .

      - name: Download Web Bundle Artifact
        uses: actions/download-artifact@v8
        with:
          name: web-bundle
          path: .

      - name: Download Windows x64 Server Artifact
        uses: actions/download-artifact@v8
        with:
          name: server-windows-x64
          path: .

      - name: Download Windows ARM64 Server Artifact
        uses: actions/download-artifact@v8
        with:
          name: server-windows-arm64
          path: .

      - name: Download macOS Server Artifact
        uses: actions/download-artifact@v8
        with:
          name: server-macos-arm64
          path: .

      - name: Rename APK with Version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          mv app-release.apk "crowleys-cloud-${VERSION}.apk"
          echo "APK_NAME=crowleys-cloud-${VERSION}.apk" >> $GITHUB_ENV

      - name: Generate Release Notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "## What's Changed" > release_notes.md
          echo "" >> release_notes.md
          if [ -n "$PREV_TAG" ]; then
            git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges >> release_notes.md
          else
            git log --pretty=format:"- %s" --no-merges -20 >> release_notes.md
          fi
          echo "" >> release_notes.md
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "### macOS Server" >> release_notes.md
          echo "Download \`crowleys-cloud-server-macos-arm64.tar.gz\`, extract, and execute \`./run.sh\`." >> release_notes.md
          echo "" >> release_notes.md
          echo "### Windows Server" >> release_notes.md
          echo "- **x64**: Download \`crowleys-cloud-server-windows-x64.zip\`, extract, and double-click \`run.bat\`." >> release_notes.md
          echo "- **ARM64**: Download \`crowleys-cloud-server-windows-arm64.zip\`, extract, and double-click \`run.bat\`." >> release_notes.md
          echo "" >> release_notes.md
          echo "### Android App" >> release_notes.md
          echo "Download the APK file below and install it on your Android device." >> release_notes.md
          echo "" >> release_notes.md
          echo "### Web Client" >> release_notes.md
          echo "Standalone web client assets are attached as \`crowleys-cloud-web-${GITHUB_REF#refs/tags/v}.tar.gz\` (extract into \`public/\`)." >> release_notes.md
          echo "" >> release_notes.md
          echo "### Server Docker Image" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "docker pull ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/crowleys-cloud-server:${GITHUB_REF#refs/tags/}" >> release_notes.md
          echo '```' >> release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          files: |
            ${{ env.APK_NAME }}
            crowleys-cloud-web-*.tar.gz
            crowleys-cloud-server-windows-x64.zip
            crowleys-cloud-server-windows-arm64.zip
            crowleys-cloud-server-macos-arm64.tar.gz
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-rc') || contains(github.ref, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
