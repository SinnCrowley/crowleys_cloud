name: crowleys_cloud
description: "Mobile app for Crowley's Cloud Server"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  permission_handler: ^12.0.1
  path_provider: ^2.1.5
  video_thumbnail: ^0.5.3
  async: ^2.11.0
  shared_preferences: ^2.2.3
  path: ^1.9.0
  crypto: ^3.0.7
  photo_manager: ^3.9.0
  photo_manager_image_provider: ^2.2.0
  share_plus: ^12.0.2
  open_file: ^3.5.11

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
