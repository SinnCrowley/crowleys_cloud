name: crowleys_cloud
description: "Mobile app for Crowley's Cloud Server"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  permission_handler: ^12.0.1
  path_provider: ^2.1.5
  video_thumbnail: ^0.5.3
  async: ^2.11.0
  shared_preferences: ^2.2.3
  path: ^1.9.0
  crypto: ^3.0.7
  photo_manager: ^3.9.0
  photo_manager_image_provider: ^2.2.0
  share_plus: ^12.0.2
  open_file: ^3.5.11
  flutter_secure_storage: ^9.2.4
  http: ^1.2.2
  local_auth: ^3.0.1
  workmanager: ^0.9.0+3
  device_info_plus: ^12.4.0
  flutter_local_notifications: ^22.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/crowleys_cloud.png"
  adaptive_icon_background: "#333333"
  adaptive_icon_foreground: "assets/icon/crowleys_cloud_transparent.png"

flutter_native_splash:
  color: "#333333"
  image: assets/icon/crowleys_cloud_transparent_smaller.png
  android_12:
    image: assets/icon/crowleys_cloud_transparent_smaller.png
    color: "#333333"
