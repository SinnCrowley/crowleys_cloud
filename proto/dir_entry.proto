syntax = "proto3";

package server.proto;

message DirEntry {
  string name = 1;
  string path = 2;
  bool is_dir = 3;
  uint64 size = 4;
  int64 modified_at = 5;
  string type = 6;
  string mime_type = 7;
  string thumbnail_url = 8;
  int64 id = 9;
  string blurhash = 10;
}

message DirResponse {
  repeated DirEntry entries = 1;
}
