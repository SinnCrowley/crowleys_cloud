<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Crowley's Cloud - Shared Link</title>
  <link rel="icon" type="image/png" href="/public/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>
    :root {
      --font-sans: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'Fira Code', 'Roboto Mono', Consolas, monospace;

      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 18px;
      --radius-full: 9999px;

      --shadow-card: 0 10px 18px rgba(0, 0, 0, 0.28);
      --shadow-dropdown: 0 4px 12px rgba(0, 0, 0, 0.25);
    }

    /* Dark Theme (Default) */
    :root[data-theme="dark"], body.theme-dark {
      --bg-background: #1E1E1E;
      --bg-surface: #2C2C2C;
      --bg-surface-hover: #353535;
      --bg-input: #1E1E1E;
      --accent-color: #FA5252;
      --accent-hover: #FF6B6B;
      --text-main: #FFFFFF;
      --text-sub: #A0A0A0;
      --border-color: #3D3D3D;
      --selection-bg: rgba(250, 82, 82, 0.15);
      --selection-border: #FA5252;
      --color-danger: #FF5252;
    }

    /* Light Theme */
    :root[data-theme="light"], body.theme-light {
      --bg-background: #F4F5F8;
      --bg-surface: #FFFFFF;
      --bg-surface-hover: #F8F9FA;
      --bg-input: #F4F5F8;
      --accent-color: #FA5252;
      --accent-hover: #FF6B6B;
      --text-main: #1F2937;
      --text-sub: #6B7280;
      --border-color: #E5E7EB;
      --selection-bg: rgba(250, 82, 82, 0.12);
      --selection-border: #FA5252;
      --color-danger: #FF5252;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      overflow-x: hidden;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-background);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      margin: 0;
      padding: 0;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    /* Top Header Bar matching HeaderBar.svelte */
    header.header-bar {
      height: 64px;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      gap: 16px;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-main);
    }

    .brand-logo {
      height: 50px;
      max-height: 52px;
      width: auto;
      object-fit: contain;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent-color);
    }

    .search-section {
      flex: 1;
      max-width: 440px;
    }

    .search-wrapper {
      position: relative;
      width: 100%;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-sub);
      pointer-events: none;
      font-size: 20px;
    }

    .search-pill {
      width: 100%;
      height: 40px;
      border-radius: var(--radius-full);
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      padding: 0 36px 0 44px;
      color: var(--text-main);
      outline: none;
      font-size: 13px;
      font-weight: 500;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .search-pill:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 2px rgba(250, 82, 82, 0.15);
    }

    .clear-search-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-sub);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      cursor: pointer;
    }

    .clear-search-btn:hover {
      color: var(--text-main);
      background-color: var(--bg-surface-hover);
    }

    .actions-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Buttons matching system .btn and .btn-icon */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: var(--radius-md);
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: background-color 0.15s ease, transform 0.1s ease;
      white-space: nowrap;
    }

    .btn-primary {
      background-color: var(--accent-color);
      color: #FFFFFF;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background-color: var(--bg-surface-hover);
    }

    .btn-icon {
      width: 36px;
      height: 36px;
      padding: 0;
      border-radius: var(--radius-full);
      background: transparent;
      color: var(--text-sub);
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .btn-icon:hover {
      background-color: var(--bg-surface-hover);
      color: var(--text-main);
    }

    .header-divider {
      width: 1px;
      height: 20px;
      background-color: var(--border-color);
      margin: 0 4px;
    }

    /* Main Container */
    main.main-content {
      flex: 1;
      width: 100%;
      padding: 24px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    /* Breadcrumbs matching BreadcrumbBar.svelte */
    .breadcrumb-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .crumb-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: none;
      color: var(--text-sub);
      font-size: 14px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .crumb-btn:hover {
      background-color: var(--bg-surface-hover);
      color: var(--text-main);
    }

    .crumb-btn.active {
      color: var(--accent-color);
      font-weight: 700;
      background-color: var(--selection-bg);
    }

    .crumb-separator {
      color: var(--text-sub);
      font-size: 16px;
      opacity: 0.5;
    }

    /* File Grid Layout matching FileGrid.svelte */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      overflow-y: auto;
      flex: 1;
      align-content: start;
      padding-bottom: 32px;
    }

    .grid-item {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      aspect-ratio: 1 / 1.12;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.1s ease, border-color 0.1s ease;
      min-width: 0;
      position: relative;
    }

    .grid-item:hover {
      background-color: var(--bg-surface-hover);
      border-color: rgba(250, 82, 82, 0.15);
    }

    .grid-item-thumbnail {
      width: 100%;
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: var(--radius-md);
      background-color: var(--bg-background);
      margin-bottom: 8px;
    }

    .grid-item-thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .grid-item-icon {
      font-size: 52px;
      color: var(--text-sub);
    }

    .grid-item-icon.icon-folder {
      color: var(--accent-color);
    }

    .grid-item-info {
      width: 100%;
    }

    .grid-item-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      text-align: left;
    }

    .grid-item-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-top: 4px;
      height: 24px;
    }

    .grid-item-meta {
      font-size: 11px;
      color: var(--text-sub);
    }

    .grid-item-action-btn {
      width: 24px;
      height: 24px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-sub);
      transition: background-color 0.15s ease, color 0.15s ease;
      text-decoration: none;
    }

    .grid-item-action-btn:hover {
      background-color: var(--bg-background);
      color: var(--accent-color);
    }

    /* File List Layout matching FileList.svelte */
    .list-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
      flex: 1;
      padding-bottom: 32px;
    }

    .list-header {
      display: grid;
      grid-template-columns: 48px 4.5fr 2fr 2fr 60px;
      gap: 12px;
      padding: 12px 16px;
      color: var(--text-sub);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 8px;
    }

    .list-row {
      display: grid;
      grid-template-columns: 48px 4.5fr 2fr 2fr 60px;
      gap: 12px;
      padding: 12px 16px;
      align-items: center;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .list-row:hover {
      background-color: var(--bg-surface-hover);
    }

    .list-icon {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .file-type-icon {
      font-size: 20px;
      color: var(--accent-color);
    }

    .list-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .list-size, .list-date {
      font-size: 13px;
      color: var(--text-sub);
      text-align: right;
    }

    .list-action {
      display: flex;
      justify-content: flex-end;
    }

    /* Single File Showcase Card */
    .file-showcase {
      max-width: 860px;
      width: 100%;
      margin: 20px auto;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      box-shadow: var(--shadow-card);
    }

    .showcase-title {
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      color: var(--text-main);
      word-break: break-word;
    }

    .preview-stage {
      width: 100%;
      max-height: 60vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      border-radius: var(--radius-lg);
      background-color: var(--bg-background);
      border: 1px solid var(--border-color);
      cursor: pointer;
      position: relative;
    }

    .preview-stage img {
      max-width: 100%;
      max-height: 60vh;
      object-fit: contain;
      border-radius: var(--radius-md);
    }

    .preview-stage video {
      max-width: 100%;
      max-height: 60vh;
      outline: none;
      border-radius: var(--radius-md);
    }

    .audio-stage {
      width: 100%;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      background-color: var(--bg-background);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
    }

    .audio-stage audio {
      width: 100%;
      max-width: 480px;
    }

    .code-container {
      width: 100%;
      max-height: 55vh;
      overflow: auto;
      background-color: #121316;
      color: #E2E8F0;
      padding: 20px;
      border-radius: var(--radius-lg);
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-all;
      border: 1px solid var(--border-color);
    }

    .generic-file-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 48px 20px;
      text-align: center;
      background-color: var(--bg-background);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      width: 100%;
    }

    .generic-icon {
      font-size: 64px;
      color: var(--accent-color);
    }

    .file-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 14px;
      background-color: var(--selection-bg);
      color: var(--accent-color);
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .showcase-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      width: 100%;
    }

    /* Lightbox Modal matching MediaPreviewModal.svelte */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background-color: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .lightbox.active {
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox-header {
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.4);
    }

    .lightbox-title {
      font-size: 16px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 60vw;
    }

    .lightbox-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
      position: relative;
    }

    .lightbox-content {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .lightbox-content img, .lightbox-content video {
      max-width: 90vw;
      max-height: 80vh;
      object-fit: contain;
      border-radius: var(--radius-md);
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.8);
    }

    .lightbox-nav {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      width: 44px;
      height: 44px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease;
      z-index: 10;
      flex-shrink: 0;
    }

    .lightbox-nav:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    /* Text Preview Modal */
    .text-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background-color: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      padding: 24px;
    }

    .text-modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .text-modal-header {
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #ffffff;
      background: var(--bg-surface);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      border: 1px solid var(--border-color);
      border-bottom: none;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    .text-modal-title {
      font-size: 16px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .text-modal-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      min-height: 0;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 0 0 var(--radius-lg) var(--radius-lg);
      padding: 16px;
      overflow: hidden;
    }

    .text-modal-body .code-container {
      width: 100%;
      height: 100%;
      max-height: 100%;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 2000;
      background-color: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 12px 20px;
      border-radius: var(--radius-full);
      box-shadow: var(--shadow-card);
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.2s ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Loading Spinner & Empty state */
    .spinner-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 300px;
      gap: 16px;
      color: var(--text-sub);
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border-color);
      border-top-color: var(--accent-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 20px;
      text-align: center;
      width: 100%;
    }

    .empty-icon {
      font-size: 56px;
      color: var(--text-sub);
      opacity: 0.5;
      margin-bottom: 12px;
    }

    .empty-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .empty-sub {
      font-size: 13px;
      color: var(--text-sub);
    }

    @media (max-width: 768px) {
      header.header-bar {
        padding: 0 16px;
      }
      .search-section {
        display: none;
      }
      .list-header {
        display: none;
      }
      .list-row {
        grid-template-columns: 40px 1fr 40px;
      }
      .list-size, .list-date {
        display: none;
      }
    }

    @media (max-width: 640px) {
      header.header-bar {
        padding: 0 10px;
        gap: 8px;
      }
      .brand {
        gap: 6px;
      }
      .brand-logo {
        height: 42px;
      }
      .actions-section {
        gap: 6px;
      }
      .header-divider {
        display: none;
      }
      .btn-primary {
        padding: 6px 12px;
        font-size: 13px;
      }
      .file-showcase {
        padding: 20px;
        gap: 16px;
      }
      .showcase-title {
        font-size: 18px;
      }
      .showcase-actions {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }
      .showcase-actions .btn {
        width: 100%;
        justify-content: center;
      }
    }

    @media (max-width: 440px) {
      .brand-title {
        font-size: 13px;
      }
      .download-text {
        display: none;
      }
      .btn-primary {
        padding: 8px;
        border-radius: var(--radius-full);
        width: 36px;
        height: 36px;
      }
      .text-modal {
        padding: 12px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Header Bar -->
  <header class="header-bar">
    <a href="#" class="brand">
      <img src="/public/logo_horizontal.png" class="brand-logo" alt="Crowley's Cloud Logo">
    </a>

    <!-- Live Search Pill Input -->
    <div class="search-section">
      <div class="search-wrapper">
        <span class="material-symbols-outlined search-icon">search</span>
        <input
          type="text"
          class="search-pill"
          id="searchInput"
          placeholder="Filter files..."
          oninput="onFilterChange(this.value)"
        />
        <button
          type="button"
          class="clear-search-btn"
          id="clearSearchBtn"
          style="display:none;"
          onclick="clearSearch()"
        >
          <span class="material-symbols-outlined" style="font-size: 16px;">close</span>
        </button>
      </div>
    </div>

    <!-- Actions & Toolbar -->
    <div class="actions-section">
      <!-- Layout View Toggle Button -->
      <button
        class="btn-icon"
        id="layoutToggleBtn"
        onclick="toggleLayout()"
        title="Toggle Grid / List View"
      >
        <span class="material-symbols-outlined" id="layoutIcon">grid_view</span>
      </button>

      <div class="header-divider"></div>

      <!-- Theme Switcher Button -->
      <button
        class="btn-icon"
        id="themeToggleBtn"
        onclick="toggleTheme()"
        title="Toggle Light / Dark Mode"
      >
        <span class="material-symbols-outlined" id="themeIcon">light_mode</span>
      </button>

      <!-- Main Download Button -->
      <a href="#" class="btn btn-primary" id="mainDownloadBtn">
        <span class="material-symbols-outlined" style="font-size: 18px;">download</span>
        <span id="downloadBtnText" class="download-text">Download</span>
      </a>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="main-content" id="appMain">
    <div class="spinner-container">
      <div class="spinner"></div>
      <p class="text-sub">Loading shared resource...</p>
    </div>
  </main>

  <!-- Fullscreen Lightbox Modal for Photos/Videos -->
  <div class="lightbox" id="lightboxModal">
    <div class="lightbox-header">
      <span class="lightbox-title" id="lightboxTitle">Preview</span>
      <div style="display:flex; gap:10px;">
        <a href="#" class="btn-icon" id="lightboxDownloadBtn" title="Download" style="color:#fff;">
          <span class="material-symbols-outlined">download</span>
        </a>
        <button class="btn-icon" id="lightboxCloseBtn" title="Close (Esc)" style="color:#fff;">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
    </div>
    <div class="lightbox-body">
      <button class="lightbox-nav" id="lightboxPrevBtn" title="Previous">
        <span class="material-symbols-outlined">chevron_left</span>
      </button>
      <div class="lightbox-content" id="lightboxContent"></div>
      <button class="lightbox-nav" id="lightboxNextBtn" title="Next">
        <span class="material-symbols-outlined">chevron_right</span>
      </button>
    </div>
  </div>

  <!-- Text Viewer Modal for Code / Text Files -->
  <div class="text-modal" id="textModal">
    <div class="text-modal-header">
      <div style="display:flex; align-items:center; gap:8px;">
        <span class="material-symbols-outlined" style="color:var(--accent-color);">article</span>
        <span class="text-modal-title" id="textModalTitle">Text Preview</span>
      </div>
      <div style="display:flex; gap:10px;">
        <a href="#" class="btn-icon" id="textModalDownloadBtn" title="Download" style="color:#fff;">
          <span class="material-symbols-outlined">download</span>
        </a>
        <button class="btn-icon" id="textModalCloseBtn" onclick="closeTextModal()" title="Close (Esc)" style="color:#fff;">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
    </div>
    <div class="text-modal-body">
      <div class="code-container" id="textModalContent">Loading content...</div>
    </div>
  </div>

  <!-- Toast Message -->
  <div class="toast" id="toast">Copied to clipboard!</div>

  <script>
    const token = window.location.pathname.split('/')[2];
    let shareData = null;
    let currentRelPath = '';
    let currentLayout = localStorage.getItem('viewLayout') || 'grid'; // grid | list
    let filteredFiles = [];
    let mediaList = [];
    let currentLightboxIdx = -1;

    // Internationalization (i18n) dictionaries
    const dictionaries = {
      en: {
        share_title: "Shared Link",
        search_placeholder: "Filter files...",
        toggle_view: "Toggle Grid / List View",
        toggle_theme: "Toggle Light / Dark Mode",
        download: "Download",
        download_all_zip: "Download All (.zip)",
        download_file: "Download ({size})",
        fullscreen: "Fullscreen",
        loading_resource: "Loading shared resource...",
        loading_files: "Loading files...",
        loading_content: "Loading content...",
        loading_preview: "Loading preview content...",
        error_text_preview: "Error loading text preview.",
        error_load_resource: "Failed to load shared resource",
        error_network: "Network error connecting to server",
        preview: "Preview",
        text_preview: "Text Preview",
        close: "Close (Esc)",
        prev: "Previous (←)",
        next: "Next (→)",
        copied: "Copied to clipboard!",
        empty_title: "This directory is empty",
        empty_sub: "No files found matching your criteria",
        type: "Type",
        name: "Name",
        size: "Size",
        modified: "Modified",
        action: "Action",
        folder: "Folder",
        document: "DOCUMENT"
      },
      ru: {
        share_title: "Общая ссылка",
        search_placeholder: "Фильтр файлов...",
        toggle_view: "Сетка / Список",
        toggle_theme: "Переключить тему",
        download: "Скачать",
        download_all_zip: "Скачать всё (.zip)",
        download_file: "Скачать ({size})",
        fullscreen: "Во весь экран",
        loading_resource: "Загрузка ресурса...",
        loading_files: "Загрузка файлов...",
        loading_content: "Загрузка содержимого...",
        loading_preview: "Загрузка предпросмотра...",
        error_text_preview: "Ошибка загрузки предпросмотра.",
        error_load_resource: "Не удалось загрузить ресурс",
        error_network: "Ошибка сети при подключении к серверу",
        preview: "Просмотр",
        text_preview: "Текстовый просмотр",
        close: "Закрыть (Esc)",
        prev: "Предыдущий (←)",
        next: "Следующий (→)",
        copied: "Скопировано в буфер обмена!",
        empty_title: "В этой папке пусто",
        empty_sub: "Файлы по вашему запросу не найдены",
        type: "Тип",
        name: "Имя",
        size: "Размер",
        modified: "Изменен",
        action: "Действие",
        folder: "Папка",
        document: "ДОКУМЕНТ"
      }
    };

    function detectSystemLanguage() {
      try {
        if (typeof navigator !== 'undefined') {
          const candidates = (navigator.languages && navigator.languages.length > 0)
            ? navigator.languages
            : [navigator.language || navigator.userLanguage || ''];
          for (const raw of candidates) {
            if (!raw || typeof raw !== 'string') continue;
            const tag = raw.toLowerCase().trim();
            if (tag.startsWith('ru') || tag.startsWith('be') || tag.startsWith('kk') || tag.startsWith('uk')) {
              return 'ru';
            }
            if (tag.startsWith('en')) {
              return 'en';
            }
          }
        }
      } catch (_) {}
      return 'en';
    }

    function getActiveLanguage() {
      try {
        const saved = localStorage.getItem('cc_language') || localStorage.getItem('cc_share_lang') || 'system';
        if (saved === 'ru' || saved === 'en') return saved;
        const detected = detectSystemLanguage();
        return (detected === 'ru' || detected === 'en') ? detected : 'en';
      } catch (_) {
        return 'en';
      }
    }

    const currentLocale = getActiveLanguage();

    function t(key, params = null) {
      try {
        const dict = dictionaries[currentLocale] || dictionaries.en;
        let text = dict[key] || (dictionaries.en && dictionaries.en[key]) || key;
        if (params && typeof params === 'object') {
          Object.keys(params).forEach(k => {
            text = text.replace(new RegExp('\\{' + k + '\\}', 'g'), params[k]);
          });
        }
        return text;
      } catch (_) {
        return (dictionaries.en && dictionaries.en[key]) || key;
      }
    }

    function updateStaticTexts() {
      document.title = `Crowley's Cloud - ${t('share_title')}`;
      const searchInput = document.getElementById('searchInput');
      if (searchInput) searchInput.placeholder = t('search_placeholder');
      const layoutToggleBtn = document.getElementById('layoutToggleBtn');
      if (layoutToggleBtn) layoutToggleBtn.title = t('toggle_view');
      const themeToggleBtn = document.getElementById('themeToggleBtn');
      if (themeToggleBtn) themeToggleBtn.title = t('toggle_theme');
      const lightboxTitle = document.getElementById('lightboxTitle');
      if (lightboxTitle) lightboxTitle.textContent = t('preview');
      const lightboxDownloadBtn = document.getElementById('lightboxDownloadBtn');
      if (lightboxDownloadBtn) lightboxDownloadBtn.title = t('download');
      const lightboxCloseBtn = document.getElementById('lightboxCloseBtn');
      if (lightboxCloseBtn) lightboxCloseBtn.title = t('close');
      const lightboxPrevBtn = document.getElementById('lightboxPrevBtn');
      if (lightboxPrevBtn) lightboxPrevBtn.title = t('prev');
      const lightboxNextBtn = document.getElementById('lightboxNextBtn');
      if (lightboxNextBtn) lightboxNextBtn.title = t('next');
      const textModalTitle = document.getElementById('textModalTitle');
      if (textModalTitle) textModalTitle.textContent = t('text_preview');
      const textModalDownloadBtn = document.getElementById('textModalDownloadBtn');
      if (textModalDownloadBtn) textModalDownloadBtn.title = t('download');
      const textModalCloseBtn = document.getElementById('textModalCloseBtn');
      if (textModalCloseBtn) textModalCloseBtn.title = t('close');
    }

    // Material Icon mapping helper matching FileGrid & FileList
    function getMaterialIcon(file) {
      if (!file) return 'insert_drive_file';
      if (file.isDir) return 'folder';
      const name = (file.name || '').toLowerCase();
      const ext = name.includes('.') ? name.split('.').pop() : '';
      const type = (file.type || '').toLowerCase();

      switch (ext) {
        case 'pdf': return 'picture_as_pdf';
        case 'doc': case 'docx': return 'description';
        case 'xls': case 'xlsx': return 'table_chart';
        case 'ppt': case 'pptx': return 'slideshow';
        case 'zip': case 'tar': case 'gz': case '7z': case 'rar': case 'bz2': case 'xz': return 'folder_zip';
        case 'mp3': case 'wav': case 'ogg': case 'flac': case 'm4a': case 'aac': return 'audiotrack';
        case 'mp4': case 'mkv': case 'avi': case 'mov': case 'webm': case 'flv': return 'movie';
        case 'jpg': case 'jpeg': case 'png': case 'webp': case 'gif': case 'bmp': case 'heic': case 'avif': case 'heif': return 'image';
        case 'txt': case 'md': case 'json': case 'yaml': case 'yml': case 'xml': case 'log': case 'csv': case 'js': case 'ts': case 'html': case 'css': case 'dart': case 'cpp': case 'c': case 'h': case 'hpp': case 'py': case 'sh': return 'article';
        default:
          if (type === 'photo' || type === 'image') return 'image';
          if (type === 'video') return 'movie';
          if (type === 'audio') return 'audiotrack';
          if (type === 'archive') return 'folder_zip';
          return 'insert_drive_file';
      }
    }

    function getFileTypeCategory(file) {
      if (!file) return 'other';
      if (file.isDir) return 'directory';
      const icon = getMaterialIcon(file);
      if (icon === 'image') return 'image';
      if (icon === 'movie') return 'video';
      if (icon === 'audiotrack') return 'audio';
      if (icon === 'article') return 'text';
      if (icon === 'picture_as_pdf' || icon === 'description' || icon === 'table_chart' || icon === 'slideshow') return 'document';
      return 'other';
    }

    // Theme Management
    function initTheme() {
      const savedTheme = localStorage.getItem('cc_web_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      updateThemeIcon();
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('cc_web_theme', next);
      updateThemeIcon();
    }

    function updateThemeIcon() {
      const current = document.documentElement.getAttribute('data-theme');
      const iconEl = document.getElementById('themeIcon');
      if (iconEl) {
        iconEl.textContent = current === 'dark' ? 'light_mode' : 'dark_mode';
      }
    }

    initTheme();
    updateStaticTexts();

    function showToast(msg) {
      const tEl = document.getElementById('toast');
      tEl.textContent = msg || t('copied');
      tEl.classList.add('show');
      setTimeout(() => tEl.classList.remove('show'), 2500);
    }

    // Data Fetching
    async function loadShareInfo(relPath = '') {
      currentRelPath = relPath;
      const appMain = document.getElementById('appMain');
      appMain.innerHTML = `
        <div class="spinner-container">
          <div class="spinner"></div>
          <p class="text-sub">${t('loading_files')}</p>
        </div>
      `;

      try {
        const url = `/api/public/share/${token}/info?p=${encodeURIComponent(relPath)}`;
        const resp = await fetch(url);
        if (!resp.ok) {
          const err = await resp.json();
          showError(err.error || t('error_load_resource'));
          return;
        }
        shareData = await resp.json();
        renderView();
      } catch (e) {
        showError(t('error_network'));
      }
    }

    function showError(msg) {
      document.getElementById('appMain').innerHTML = `
        <div class="empty-state">
          <span class="material-symbols-outlined empty-icon" style="color:var(--color-danger); opacity:1;">error_outline</span>
          <h3 class="empty-title">${escapeHtml(msg)}</h3>
        </div>
      `;
    }

    function toggleLayout() {
      currentLayout = currentLayout === 'grid' ? 'list' : 'grid';
      localStorage.setItem('viewLayout', currentLayout);
      updateLayoutIcon();
      renderView();
    }

    function updateLayoutIcon() {
      const iconEl = document.getElementById('layoutIcon');
      if (iconEl) {
        iconEl.textContent = currentLayout === 'grid' ? 'list' : 'grid_view';
      }
    }

    function onFilterChange(query) {
      const q = query.toLowerCase().trim();
      const clearBtn = document.getElementById('clearSearchBtn');
      if (clearBtn) clearBtn.style.display = q ? 'block' : 'none';

      const files = shareData.files || [];
      if (!q) {
        filteredFiles = files;
      } else {
        filteredFiles = files.filter(f => f.name.toLowerCase().includes(q));
      }
      renderFileContainer();
    }

    function clearSearch() {
      const input = document.getElementById('searchInput');
      if (input) {
        input.value = '';
        onFilterChange('');
      }
    }

    function renderView() {
      const appMain = document.getElementById('appMain');
      const mainDownloadBtn = document.getElementById('mainDownloadBtn');
      const downloadBtnText = document.getElementById('downloadBtnText');

      updateLayoutIcon();

      if (!shareData.isFolder && currentRelPath === '') {
        mainDownloadBtn.href = `/s/${token}/raw?download=1`;
        downloadBtnText.textContent = t('download');

        renderSingleFileView(shareData.files[0] || {
          name: shareData.rootName,
          relPath: '',
          size: shareData.size || 0,
          mimeType: shareData.mimeType || '',
          type: shareData.type || 'other'
        });
        return;
      }

      mainDownloadBtn.href = `/s/${token}/zip?p=${encodeURIComponent(currentRelPath)}`;
      downloadBtnText.textContent = t('download_all_zip');

      filteredFiles = shareData.files || [];
      mediaList = filteredFiles.filter(f => {
        const cat = getFileTypeCategory(f);
        return cat === 'image' || cat === 'video';
      });

      let html = `
        <div class="breadcrumb-bar">
          <button class="crumb-btn ${currentRelPath === '' ? 'active' : ''}" onclick="loadShareInfo('')">
            <span class="material-symbols-outlined" style="font-size:18px;">folder_open</span>
            <span>${escapeHtml(shareData.rootName)}</span>
          </button>
          ${renderBreadcrumbsHTML(currentRelPath)}
        </div>
        <div id="fileContainer"></div>
      `;

      appMain.innerHTML = html;
      renderFileContainer();
    }

    function renderBreadcrumbsHTML(relPath) {
      if (!relPath) return '';
      const parts = relPath.split('/');
      let accumulated = '';
      let res = '';
      parts.forEach((part, idx) => {
        accumulated += (accumulated ? '/' : '') + part;
        const isLast = idx === parts.length - 1;
        const curAcc = accumulated;
        res += `
          <span class="crumb-separator">/</span>
          <button class="crumb-btn ${isLast ? 'active' : ''}" ${isLast ? '' : `onclick="loadShareInfo('${escapeJs(curAcc)}')"`}>
            <span>${escapeHtml(part)}</span>
          </button>
        `;
      });
      return res;
    }

    function renderFileContainer() {
      const container = document.getElementById('fileContainer');
      if (!container) return;

      if (filteredFiles.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <span class="material-symbols-outlined empty-icon">folder_open</span>
            <h3 class="empty-title">${t('empty_title')}</h3>
            <p class="empty-sub">${t('empty_sub')}</p>
          </div>
        `;
        return;
      }

      if (currentLayout === 'grid') {
        let gridHtml = '<div class="grid-container">';
        filteredFiles.forEach(file => {
          gridHtml += renderGridCard(file);
        });
        gridHtml += '</div>';
        container.innerHTML = gridHtml;
      } else {
        let listHtml = `
          <div class="list-container">
            <div class="list-header">
              <span>${t('type')}</span>
              <span>${t('name')}</span>
              <span style="text-align:right;">${t('size')}</span>
              <span style="text-align:right;">${t('modified')}</span>
              <span style="text-align:right;">${t('action')}</span>
            </div>
        `;
        filteredFiles.forEach(file => {
          listHtml += renderListRow(file);
        });
        listHtml += '</div>';
        container.innerHTML = listHtml;
      }
    }

    function renderGridCard(file) {
      const rawUrl = `/s/${token}/raw?p=${encodeURIComponent(file.relPath)}`;
      const downloadUrl = `/s/${token}/raw?download=1&p=${encodeURIComponent(file.relPath)}`;
      const category = getFileTypeCategory(file);
      
      let thumbnailContent = '';
      if (file.isDir) {
        thumbnailContent = `<span class="material-symbols-outlined grid-item-icon icon-folder">folder</span>`;
      } else if (category === 'image') {
        thumbnailContent = `<img src="${rawUrl}" loading="lazy" alt="${escapeHtml(file.name)}">`;
      } else {
        thumbnailContent = `<span class="material-symbols-outlined grid-item-icon">${getMaterialIcon(file)}</span>`;
      }

      const clickHandler = file.isDir
        ? `loadShareInfo('${escapeJs(file.relPath)}')`
        : `onFileClick('${escapeJs(file.relPath)}')`;

      return `
        <div class="grid-item" onclick="${clickHandler}">
          <div class="grid-item-thumbnail">
            ${thumbnailContent}
          </div>
          <div class="grid-item-info">
            <div class="grid-item-name" title="${escapeHtml(file.name)}">${escapeHtml(file.name)}</div>
            <div class="grid-item-meta-row">
              <span class="grid-item-meta">${file.isDir ? t('folder') : formatSize(file.size)}</span>
              ${!file.isDir ? `
                <a href="${downloadUrl}" onclick="event.stopPropagation()" class="grid-item-action-btn" title="${t('download')}">
                  <span class="material-symbols-outlined" style="font-size: 16px;">download</span>
                </a>
              ` : ''}
            </div>
          </div>
        </div>
      `;
    }

    function renderListRow(file) {
      const downloadUrl = `/s/${token}/raw?download=1&p=${encodeURIComponent(file.relPath)}`;
      const clickHandler = file.isDir
        ? `loadShareInfo('${escapeJs(file.relPath)}')`
        : `onFileClick('${escapeJs(file.relPath)}')`;

      const iconName = getMaterialIcon(file);

      return `
        <div class="list-row" onclick="${clickHandler}">
          <div class="list-icon">
            <span class="material-symbols-outlined file-type-icon">${iconName}</span>
          </div>
          <div class="list-name" title="${escapeHtml(file.name)}">${escapeHtml(file.name)}</div>
          <div class="list-size">${file.isDir ? '--' : formatSize(file.size)}</div>
          <div class="list-date">${formatDate(file.modifiedAt)}</div>
          <div class="list-action">
            ${!file.isDir ? `
              <a href="${downloadUrl}" onclick="event.stopPropagation()" class="grid-item-action-btn" title="${t('download')}">
                <span class="material-symbols-outlined" style="font-size: 18px;">download</span>
              </a>
            ` : ''}
          </div>
        </div>
      `;
    }

    function renderSingleFileView(file) {
      const appMain = document.getElementById('appMain');
      const rawUrl = `/s/${token}/raw`;
      const downloadUrl = `/s/${token}/raw?download=1`;
      const category = getFileTypeCategory(file);

      let mediaStageHtml = '';
      let isMedia = false;

      if (category === 'image') {
        isMedia = true;
        mediaList = [file];
        mediaStageHtml = `
          <div class="preview-stage" onclick="openLightbox(0)" title="${t('fullscreen')}">
            <img src="${rawUrl}" alt="${escapeHtml(file.name)}">
          </div>`;
      } else if (category === 'video') {
        isMedia = true;
        mediaList = [file];
        mediaStageHtml = `
          <div class="preview-stage">
            <video src="${rawUrl}" controls autoplay></video>
          </div>`;
      } else if (category === 'audio') {
        mediaStageHtml = `
          <div class="audio-stage">
            <span class="material-symbols-outlined" style="font-size:64px; color:var(--accent-color);">audiotrack</span>
            <audio src="${rawUrl}" controls></audio>
          </div>`;
      } else if (category === 'text') {
        fetchTextPreview(rawUrl);
        mediaStageHtml = `<div class="code-container" id="codePreview">${t('loading_preview')}</div>`;
      } else {
        const ext = file.name.includes('.') ? file.name.split('.').pop().toUpperCase() : 'FILE';
        mediaStageHtml = `
          <div class="generic-file-box">
            <span class="material-symbols-outlined generic-icon">${getMaterialIcon(file)}</span>
            <div class="file-badge">${escapeHtml(ext)} ${t('document')}</div>
          </div>`;
      }

      appMain.innerHTML = `
        <div class="file-showcase">
          <h2 class="showcase-title">${escapeHtml(file.name)}</h2>
          ${mediaStageHtml}
          <div class="showcase-actions">
            <a href="${downloadUrl}" class="btn btn-primary">
              <span class="material-symbols-outlined" style="font-size: 18px;">download</span>
              ${t('download_file', { size: formatSize(file.size) })}
            </a>
            ${isMedia ? `
              <button class="btn btn-secondary" onclick="openLightbox(0)">
                <span class="material-symbols-outlined" style="font-size: 18px;">fullscreen</span>
                ${t('fullscreen')}
              </button>
            ` : ''}
          </div>
        </div>
      `;
    }

    async function fetchTextPreview(url) {
      try {
        const resp = await fetch(url);
        const text = await resp.text();
        const el = document.getElementById('codePreview');
        if (el) el.textContent = text;
      } catch (e) {
        const el = document.getElementById('codePreview');
        if (el) el.textContent = t('error_text_preview');
      }
    }

    async function openTextModal(file) {
      const modal = document.getElementById('textModal');
      const title = document.getElementById('textModalTitle');
      const content = document.getElementById('textModalContent');
      const downloadBtn = document.getElementById('textModalDownloadBtn');

      title.textContent = file.name;
      downloadBtn.href = `/s/${token}/raw?download=1${file.relPath ? '&p=' + encodeURIComponent(file.relPath) : ''}`;
      content.textContent = t('loading_content');
      modal.classList.add('active');

      const rawUrl = `/s/${token}/raw${file.relPath ? '?p=' + encodeURIComponent(file.relPath) : ''}`;
      try {
        const resp = await fetch(rawUrl);
        const text = await resp.text();
        content.textContent = text;
      } catch (e) {
        content.textContent = t('error_text_preview');
      }
    }

    function closeTextModal() {
      const modal = document.getElementById('textModal');
      modal.classList.remove('active');
    }

    function onFileClick(relPath) {
      const file = (filteredFiles || []).find(f => f.relPath === relPath);
      if (file) {
        const category = getFileTypeCategory(file);
        if (category === 'text') {
          openTextModal(file);
          return;
        }
      }

      const idx = mediaList.findIndex(m => m.relPath === relPath);
      if (idx !== -1) {
        openLightbox(idx);
      } else {
        window.location.href = `/s/${token}/raw?download=1&p=${encodeURIComponent(relPath)}`;
      }
    }

    function openLightbox(idx) {
      if (!mediaList || mediaList.length === 0) return;
      if (idx < 0 || idx >= mediaList.length) return;
      currentLightboxIdx = idx;
      const file = mediaList[idx];
      const modal = document.getElementById('lightboxModal');
      const title = document.getElementById('lightboxTitle');
      const content = document.getElementById('lightboxContent');
      const downloadBtn = document.getElementById('lightboxDownloadBtn');
      const prevBtn = document.getElementById('lightboxPrevBtn');
      const nextBtn = document.getElementById('lightboxNextBtn');

      title.textContent = mediaList.length > 1 ? `${file.name} (${idx + 1}/${mediaList.length})` : file.name;
      downloadBtn.href = `/s/${token}/raw?download=1${file.relPath ? '&p=' + encodeURIComponent(file.relPath) : ''}`;

      prevBtn.style.display = mediaList.length > 1 ? 'flex' : 'none';
      nextBtn.style.display = mediaList.length > 1 ? 'flex' : 'none';

      const rawUrl = `/s/${token}/raw${file.relPath ? '?p=' + encodeURIComponent(file.relPath) : ''}`;
      const category = getFileTypeCategory(file);
      if (category === 'image') {
        content.innerHTML = `<img src="${rawUrl}" alt="${escapeHtml(file.name)}">`;
      } else if (category === 'video') {
        content.innerHTML = `<video src="${rawUrl}" controls autoplay></video>`;
      }

      modal.classList.add('active');
    }

    function closeLightbox() {
      const modal = document.getElementById('lightboxModal');
      const content = document.getElementById('lightboxContent');
      modal.classList.remove('active');
      content.innerHTML = '';
      currentLightboxIdx = -1;
    }

    function lightboxPrev() {
      if (currentLightboxIdx > 0) openLightbox(currentLightboxIdx - 1);
    }

    function lightboxNext() {
      if (currentLightboxIdx < mediaList.length - 1) openLightbox(currentLightboxIdx + 1);
    }

    document.getElementById('lightboxCloseBtn').addEventListener('click', closeLightbox);
    document.getElementById('lightboxPrevBtn').addEventListener('click', lightboxPrev);
    document.getElementById('lightboxNextBtn').addEventListener('click', lightboxNext);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (currentLightboxIdx !== -1) closeLightbox();
        closeTextModal();
      }
      if (currentLightboxIdx !== -1) {
        if (e.key === 'ArrowLeft') lightboxPrev();
        if (e.key === 'ArrowRight') lightboxNext();
      }
    });

    function formatSize(bytes) {
      if (!bytes || bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function formatDate(ts) {
      if (!ts) return '--';
      const d = new Date(ts * 1000);
      return isNaN(d.getTime()) ? '--' : d.toLocaleDateString(currentLocale === 'ru' ? 'ru-RU' : 'en-US', { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeJs(str) {
      if (!str) return '';
      return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    loadShareInfo();
  </script>
</body>
</html>
