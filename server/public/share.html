<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Crowley's Cloud - Shared Link</title>
  <link rel="icon" type="image/png" href="/public/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Dark Theme (Default) */
      --bg-color: #121316;
      --bg-surface: #1a1c23;
      --card-bg: #222530;
      --card-hover: #2b2f3d;
      --border-color: #2e3342;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #ff4d4d;
      --accent-hover: #ff6666;
      --accent-glow: rgba(255, 77, 77, 0.35);
      --accent-alpha: rgba(255, 77, 77, 0.12);
      --header-bg: rgba(26, 28, 35, 0.88);
      --modal-backdrop: rgba(10, 11, 14, 0.88);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 6px 24px rgba(0, 0, 0, 0.45);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    [data-theme="light"] {
      --bg-color: #f3f4f8;
      --bg-surface: #ffffff;
      --card-bg: #f8f9fc;
      --card-hover: #edf0f7;
      --border-color: #e2e5ec;
      --text-main: #111827;
      --text-muted: #6b7280;
      --accent: #fa5252;
      --accent-hover: #e03131;
      --accent-glow: rgba(250, 82, 82, 0.25);
      --accent-alpha: rgba(250, 82, 82, 0.08);
      --header-bg: rgba(255, 255, 255, 0.88);
      --modal-backdrop: rgba(0, 0, 0, 0.75);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
      --shadow-md: 0 6px 24px rgba(0, 0, 0, 0.1);
    }

    @media (prefers-color-scheme: light) {
      [data-theme="auto"] {
        --bg-color: #f3f4f8;
        --bg-surface: #ffffff;
        --card-bg: #f8f9fc;
        --card-hover: #edf0f7;
        --border-color: #e2e5ec;
        --text-main: #111827;
        --text-muted: #6b7280;
        --accent: #fa5252;
        --accent-hover: #e03131;
        --accent-glow: rgba(250, 82, 82, 0.25);
        --accent-alpha: rgba(250, 82, 82, 0.08);
        --header-bg: rgba(255, 255, 255, 0.88);
        --modal-backdrop: rgba(0, 0, 0, 0.75);
        --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
        --shadow-md: 0 6px 24px rgba(0, 0, 0, 0.1);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: var(--header-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-main);
      min-width: 0;
      flex-shrink: 1;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      object-fit: contain;
      border-radius: var(--radius-sm);
      filter: drop-shadow(0 2px 6px var(--accent-glow));
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      border: 1px solid transparent;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
      white-space: nowrap;
    }

    .btn-icon {
      padding: 8px;
      border-radius: 50%;
      width: 38px;
      height: 38px;
    }

    .btn-secondary {
      background-color: var(--bg-surface);
      color: var(--text-main);
      border-color: var(--border-color);
    }

    .btn-secondary:hover {
      background-color: var(--card-hover);
      border-color: var(--text-muted);
    }

    .btn-primary {
      background-color: var(--accent);
      color: #ffffff;
      box-shadow: 0 3px 12px var(--accent-glow);
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 5px 16px var(--accent-glow);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    /* Main Container */
    main {
      flex: 1;
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Controls Bar */
    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 14px 20px;
      box-shadow: var(--shadow-sm);
    }

    .breadcrumbs {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .crumb-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      text-decoration: none;
    }

    .crumb-item:hover {
      color: var(--accent);
      background-color: var(--accent-alpha);
    }

    .crumb-item.active {
      color: var(--text-main);
      font-weight: 600;
      cursor: default;
    }

    .crumb-item.active:hover {
      background-color: transparent;
    }

    .crumb-separator {
      color: var(--text-muted);
      opacity: 0.5;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-box input {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 14px 8px 36px;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      width: 200px;
      transition: width 0.25s ease, border-color 0.2s ease;
    }

    .search-box input:focus {
      width: 260px;
      border-color: var(--accent);
    }

    .search-icon {
      position: absolute;
      left: 10px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .view-toggle {
      display: flex;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 3px;
    }

    .view-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 6px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .view-btn.active {
      background-color: var(--bg-surface);
      color: var(--accent);
      box-shadow: var(--shadow-sm);
    }

    /* Grid Layout */
    .file-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }

    .card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: var(--accent);
    }

    .card-preview {
      height: 150px;
      background-color: var(--card-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .card-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-icon {
      color: var(--text-muted);
    }

    .card-info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-title {
      font-size: 0.92rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* List Layout */
    .file-list {
      display: flex;
      flex-direction: column;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .list-header {
      display: grid;
      grid-template-columns: 48px 1fr 120px 140px 60px;
      padding: 12px 16px;
      font-size: 0.82rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-color);
      background-color: var(--card-bg);
    }

    .list-row {
      display: grid;
      grid-template-columns: 48px 1fr 120px 140px 60px;
      padding: 12px 16px;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
    }

    .list-row:last-child {
      border-bottom: none;
    }

    .list-row:hover {
      background-color: var(--card-hover);
    }

    .list-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
    }

    .list-name {
      font-size: 0.92rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-right: 12px;
    }

    .list-size, .list-date {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .list-action {
      display: flex;
      justify-content: flex-end;
    }

    .action-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 6px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .action-btn:hover {
      color: var(--accent);
      background-color: var(--accent-alpha);
    }

    /* Single File Showcase View */
    .file-showcase {
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      box-shadow: var(--shadow-md);
    }

    .showcase-title {
      font-size: 1.35rem;
      font-weight: 700;
      text-align: center;
      word-break: break-word;
      overflow-wrap: anywhere;
      max-width: 100%;
      letter-spacing: -0.3px;
    }

    .preview-stage {
      width: 100%;
      max-height: 65vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      border-radius: var(--radius-md);
      background-color: #0d0e11;
      background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 0);
      background-size: 16px 16px;
      position: relative;
      border: 1px solid var(--border-color);
      cursor: pointer;
    }

    .preview-stage img {
      max-width: 100%;
      max-height: 65vh;
      object-fit: contain;
      border-radius: 6px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }

    .preview-stage video {
      max-width: 100%;
      max-height: 65vh;
      outline: none;
      border-radius: 6px;
    }

    .audio-stage {
      width: 100%;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      background-color: var(--card-bg);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
    }

    .audio-stage audio {
      width: 100%;
      max-width: 500px;
    }

    .code-container {
      width: 100%;
      max-height: 60vh;
      overflow: auto;
      background-color: #0f1013;
      color: #e2e8f0;
      padding: 20px;
      border-radius: var(--radius-md);
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 0.9rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-all;
      border: 1px solid var(--border-color);
    }

    .generic-file-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 36px 20px;
      text-align: center;
      background-color: var(--card-bg);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      width: 100%;
    }

    .generic-icon {
      width: 72px;
      height: 72px;
      color: var(--accent);
      filter: drop-shadow(0 4px 12px var(--accent-glow));
    }

    .file-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background-color: var(--accent-alpha);
      color: var(--accent);
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .showcase-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      width: 100%;
    }

    /* Lightbox Modal */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background-color: var(--modal-backdrop);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .lightbox.active {
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox-header {
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #ffffff;
      background: rgba(0,0,0,0.3);
    }

    .lightbox-title {
      font-size: 1.05rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 60vw;
    }

    .lightbox-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
      position: relative;
    }

    .lightbox-content {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .lightbox-content img, .lightbox-content video {
      max-width: 92vw;
      max-height: 82vh;
      object-fit: contain;
      border-radius: var(--radius-sm);
      box-shadow: 0 12px 48px rgba(0,0,0,0.85);
    }

    .lightbox-nav {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
      z-index: 10;
      flex-shrink: 0;
    }

    .lightbox-nav:hover {
      background: rgba(255, 255, 255, 0.28);
      transform: scale(1.05);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 2000;
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--accent);
      padding: 12px 20px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      font-size: 0.9rem;
      font-weight: 500;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.25s ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Loading Spinner */
    .spinner-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 300px;
      gap: 16px;
      color: var(--text-muted);
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border-color);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    /* Mobile Responsive Optimizations */
    @media (max-width: 768px) {
      header {
        padding: 10px 14px;
      }
      .brand-title {
        font-size: 1rem;
      }
      .btn-text {
        display: none;
      }
      .btn-primary {
        padding: 8px 12px;
      }
      main {
        padding: 14px;
      }
      .controls-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .toolbar {
        justify-content: space-between;
      }
      .search-box input, .search-box input:focus {
        width: 100%;
      }
      .list-header {
        display: none;
      }
      .list-row {
        grid-template-columns: 40px 1fr 50px;
      }
      .list-size, .list-date {
        display: none;
      }
      .file-showcase {
        padding: 16px;
        border-radius: var(--radius-md);
      }
      .showcase-title {
        font-size: 1.15rem;
      }
      .showcase-actions .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <a href="#" class="brand">
      <img src="/public/logo.png" class="brand-logo" alt="Crowley's Cloud Logo">
      <span class="brand-title">Crowley's Cloud</span>
    </a>
    <div class="header-actions">
      <!-- Theme Switcher -->
      <button class="btn btn-secondary btn-icon" id="themeToggle" title="Toggle Theme">
        <svg id="themeIconSun" style="display:none;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
        </svg>
        <svg id="themeIconMoon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        </svg>
      </button>

      <!-- Download Button -->
      <a href="#" class="btn btn-primary" id="mainDownloadBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <span id="downloadBtnText" class="btn-text">Download</span>
      </a>
    </div>
  </header>

  <!-- Main Content Area -->
  <main id="appMain">
    <div class="spinner-container">
      <div class="spinner"></div>
      <p>Loading shared resource...</p>
    </div>
  </main>

  <!-- Lightbox Modal -->
  <div class="lightbox" id="lightboxModal">
    <div class="lightbox-header">
      <span class="lightbox-title" id="lightboxTitle">Preview</span>
      <div style="display:flex; gap:10px;">
        <a href="#" class="btn btn-secondary btn-icon" id="lightboxDownloadBtn" title="Download">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        </a>
        <button class="btn btn-secondary btn-icon" id="lightboxCloseBtn" title="Close (Esc)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="lightbox-body">
      <button class="lightbox-nav" id="lightboxPrevBtn" title="Previous">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <div class="lightbox-content" id="lightboxContent"></div>
      <button class="lightbox-nav" id="lightboxNextBtn" title="Next">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="toast" id="toast">Copied to clipboard!</div>

  <script>
    // State management
    const token = window.location.pathname.split('/')[2];
    let shareData = null;
    let currentRelPath = '';
    let currentLayout = localStorage.getItem('viewLayout') || 'grid'; // grid | list
    let filteredFiles = [];
    let mediaList = [];
    let currentLightboxIdx = -1;

    // File type classification helper (handles backend "photo" / "image" / mimeType / extensions)
    function getFileType(file) {
      if (!file) return 'other';
      if (file.isDir) return 'directory';
      const t = (file.type || '').toLowerCase();
      const m = (file.mimeType || '').toLowerCase();
      const name = (file.name || '').toLowerCase();
      const ext = name.includes('.') ? name.split('.').pop() : '';

      if (t === 'photo' || t === 'image' || m.startsWith('image/') || ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg', 'bmp', 'ico'].includes(ext)) {
        return 'image';
      }
      if (t === 'video' || m.startsWith('video/') || ['mp4', 'mkv', 'mov', 'webm', 'avi', 'flv'].includes(ext)) {
        return 'video';
      }
      if (t === 'audio' || m.startsWith('audio/') || ['mp3', 'wav', 'ogg', 'flac', 'm4a', 'aac'].includes(ext)) {
        return 'audio';
      }
      if (m.startsWith('text/') || ['txt', 'md', 'json', 'js', 'ts', 'html', 'css', 'cpp', 'h', 'hpp', 'c', 'py', 'dart', 'sh', 'yaml', 'yml', 'xml', 'log'].includes(ext)) {
        return 'text';
      }
      if (t === 'document' || m.includes('pdf') || m.includes('word') || m.includes('excel') || m.includes('presentation') || ['pdf', 'doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx'].includes(ext)) {
        return 'document';
      }
      return 'other';
    }

    // Theme Management
    function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      const htmlEl = document.documentElement;
      
      if (savedTheme) {
        htmlEl.setAttribute('data-theme', savedTheme);
      } else {
        htmlEl.setAttribute('data-theme', 'auto');
      }
      updateThemeIcons();
    }

    function toggleTheme() {
      const htmlEl = document.documentElement;
      const currentTheme = htmlEl.getAttribute('data-theme');
      let newTheme = 'dark';
      
      if (currentTheme === 'dark') {
        newTheme = 'light';
      } else if (currentTheme === 'light') {
        newTheme = 'dark';
      } else {
        const isSystemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        newTheme = isSystemDark ? 'light' : 'dark';
      }

      htmlEl.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateThemeIcons();
    }

    function updateThemeIcons() {
      const htmlEl = document.documentElement;
      const theme = htmlEl.getAttribute('data-theme');
      let effectiveDark = true;
      if (theme === 'light') effectiveDark = false;
      else if (theme === 'dark') effectiveDark = true;
      else effectiveDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

      document.getElementById('themeIconSun').style.display = effectiveDark ? 'inline-block' : 'none';
      document.getElementById('themeIconMoon').style.display = effectiveDark ? 'none' : 'inline-block';
    }

    document.getElementById('themeToggle').addEventListener('click', toggleTheme);
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateThemeIcons);
    initTheme();

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        showToast('Direct link copied to clipboard!');
      }).catch(() => {
        showToast('Failed to copy link.');
      });
    }

    // Data Fetching
    async function loadShareInfo(relPath = '') {
      currentRelPath = relPath;
      const appMain = document.getElementById('appMain');
      appMain.innerHTML = `
        <div class="spinner-container">
          <div class="spinner"></div>
          <p>Loading files...</p>
        </div>
      `;

      try {
        const url = `/api/public/share/${token}/info?p=${encodeURIComponent(relPath)}`;
        const resp = await fetch(url);
        if (!resp.ok) {
          const err = await resp.json();
          showError(err.error || 'Failed to load shared resource');
          return;
        }
        shareData = await resp.json();
        renderView();
      } catch (e) {
        showError('Network error connecting to server');
      }
    }

    function showError(msg) {
      document.getElementById('appMain').innerHTML = `
        <div class="empty-state">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.5" style="margin-bottom:16px;">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <h2>${escapeHtml(msg)}</h2>
        </div>
      `;
    }

    function renderView() {
      const appMain = document.getElementById('appMain');
      const mainDownloadBtn = document.getElementById('mainDownloadBtn');
      const downloadBtnText = document.getElementById('downloadBtnText');

      if (!shareData.isFolder && currentRelPath === '') {
        // Single File Showcase
        mainDownloadBtn.href = `/s/${token}/raw?download=1`;
        downloadBtnText.textContent = 'Download';

        renderSingleFileView(shareData.files[0] || {
          name: shareData.rootName,
          relPath: '',
          size: shareData.size || 0,
          mimeType: shareData.mimeType || '',
          type: shareData.type || 'other'
        });
        return;
      }

      // Folder Mode
      mainDownloadBtn.href = `/s/${token}/zip?p=${encodeURIComponent(currentRelPath)}`;
      downloadBtnText.textContent = 'Download All (.zip)';

      filteredFiles = shareData.files || [];
      mediaList = filteredFiles.filter(f => {
        const category = getFileType(f);
        return category === 'image' || category === 'video';
      });

      let html = `
        <div class="controls-bar">
          <div class="breadcrumbs">
            <span class="crumb-item ${currentRelPath === '' ? 'active' : ''}" onclick="loadShareInfo('')">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              </svg>
              ${escapeHtml(shareData.rootName)}
            </span>
            ${renderBreadcrumbsHTML(currentRelPath)}
          </div>
          <div class="toolbar">
            <div class="search-box">
              <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
              </svg>
              <input type="text" id="searchInput" placeholder="Filter files..." oninput="onFilterChange(this.value)">
            </div>
            <div class="view-toggle">
              <button class="view-btn ${currentLayout === 'grid' ? 'active' : ''}" onclick="setLayout('grid')" title="Grid View">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/>
                </svg>
              </button>
              <button class="view-btn ${currentLayout === 'list' ? 'active' : ''}" onclick="setLayout('list')" title="List View">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
        <div id="fileContainer"></div>
      `;

      appMain.innerHTML = html;
      renderFileContainer();
    }

    function renderBreadcrumbsHTML(relPath) {
      if (!relPath) return '';
      const parts = relPath.split('/');
      let accumulated = '';
      let res = '';
      parts.forEach((part, idx) => {
        accumulated += (accumulated ? '/' : '') + part;
        const isLast = idx === parts.length - 1;
        const curAcc = accumulated;
        res += `
          <span class="crumb-separator">/</span>
          <span class="crumb-item ${isLast ? 'active' : ''}" ${isLast ? '' : `onclick="loadShareInfo('${escapeJs(curAcc)}')"`}>
            ${escapeHtml(part)}
          </span>
        `;
      });
      return res;
    }

    function setLayout(layout) {
      currentLayout = layout;
      localStorage.setItem('viewLayout', layout);
      document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
      renderView();
    }

    function onFilterChange(query) {
      const q = query.toLowerCase().trim();
      const files = shareData.files || [];
      if (!q) {
        filteredFiles = files;
      } else {
        filteredFiles = files.filter(f => f.name.toLowerCase().includes(q));
      }
      renderFileContainer();
    }

    function renderFileContainer() {
      const container = document.getElementById('fileContainer');
      if (!container) return;

      if (filteredFiles.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.5">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            </svg>
            <p style="margin-top:12px;">This directory is empty</p>
          </div>
        `;
        return;
      }

      if (currentLayout === 'grid') {
        let gridHtml = '<div class="file-grid">';
        filteredFiles.forEach(file => {
          gridHtml += renderGridCard(file);
        });
        gridHtml += '</div>';
        container.innerHTML = gridHtml;
      } else {
        let listHtml = `
          <div class="file-list">
            <div class="list-header">
              <span>Type</span>
              <span>Name</span>
              <span>Size</span>
              <span>Modified</span>
              <span style="text-align:right;">Action</span>
            </div>
        `;
        filteredFiles.forEach(file => {
          listHtml += renderListRow(file);
        });
        listHtml += '</div>';
        container.innerHTML = listHtml;
      }
    }

    function renderGridCard(file) {
      const rawUrl = `/s/${token}/raw?p=${encodeURIComponent(file.relPath)}`;
      const downloadUrl = `/s/${token}/raw?download=1&p=${encodeURIComponent(file.relPath)}`;
      const fileType = getFileType(file);
      
      let previewContent = '';
      if (file.isDir) {
        previewContent = `
          <svg class="card-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.8">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          </svg>`;
      } else if (fileType === 'image') {
        previewContent = `<img src="${rawUrl}" loading="lazy" alt="${escapeHtml(file.name)}">`;
      } else if (fileType === 'video') {
        previewContent = `
          <svg class="card-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect width="18" height="18" x="3" y="3" rx="2"/><polygon points="10 8 16 12 10 16 10 8"/>
          </svg>`;
      } else if (fileType === 'audio') {
        previewContent = `
          <svg class="card-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
          </svg>`;
      } else if (fileType === 'text') {
        previewContent = `
          <svg class="card-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
          </svg>`;
      } else {
        previewContent = `
          <svg class="card-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/>
          </svg>`;
      }

      const clickHandler = file.isDir
        ? `loadShareInfo('${escapeJs(file.relPath)}')`
        : `onFileClick('${escapeJs(file.relPath)}')`;

      return `
        <div class="card" onclick="${clickHandler}">
          <div class="card-preview">
            ${previewContent}
          </div>
          <div class="card-info">
            <div class="card-title" title="${escapeHtml(file.name)}">${escapeHtml(file.name)}</div>
            <div class="card-meta">
              <span>${file.isDir ? 'Folder' : formatSize(file.size)}</span>
              ${!file.isDir ? `
                <a href="${downloadUrl}" onclick="event.stopPropagation()" style="color:var(--text-muted); text-decoration:none;" title="Download">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
                  </svg>
                </a>
              ` : ''}
            </div>
          </div>
        </div>
      `;
    }

    function renderListRow(file) {
      const downloadUrl = `/s/${token}/raw?download=1&p=${encodeURIComponent(file.relPath)}`;
      const clickHandler = file.isDir
        ? `loadShareInfo('${escapeJs(file.relPath)}')`
        : `onFileClick('${escapeJs(file.relPath)}')`;

      const iconSvg = file.isDir
        ? `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>`
        : `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>`;

      return `
        <div class="list-row" onclick="${clickHandler}">
          <div class="list-icon">${iconSvg}</div>
          <div class="list-name" title="${escapeHtml(file.name)}">${escapeHtml(file.name)}</div>
          <div class="list-size">${file.isDir ? '--' : formatSize(file.size)}</div>
          <div class="list-date">${formatDate(file.modifiedAt)}</div>
          <div class="list-action">
            ${!file.isDir ? `
              <a href="${downloadUrl}" onclick="event.stopPropagation()" class="action-btn" title="Download">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
              </a>
            ` : ''}
          </div>
        </div>
      `;
    }

    function renderSingleFileView(file) {
      const appMain = document.getElementById('appMain');
      const rawUrl = `/s/${token}/raw`;
      const downloadUrl = `/s/${token}/raw?download=1`;
      const fileType = getFileType(file);
      const fullDirectUrl = window.location.origin + rawUrl;

      let mediaStageHtml = '';
      let isMedia = false;

      if (fileType === 'image') {
        isMedia = true;
        mediaList = [file];
        mediaStageHtml = `
          <div class="preview-stage" onclick="openLightbox(0)" title="Click to view fullscreen">
            <img src="${rawUrl}" alt="${escapeHtml(file.name)}">
          </div>`;
      } else if (fileType === 'video') {
        isMedia = true;
        mediaList = [file];
        mediaStageHtml = `
          <div class="preview-stage">
            <video src="${rawUrl}" controls autoplay></video>
          </div>`;
      } else if (fileType === 'audio') {
        mediaStageHtml = `
          <div class="audio-stage">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.5">
              <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
            </svg>
            <audio src="${rawUrl}" controls></audio>
          </div>`;
      } else if (fileType === 'text') {
        fetchTextPreview(rawUrl);
        mediaStageHtml = `<div class="code-container" id="codePreview">Loading preview content...</div>`;
      } else {
        const ext = file.name.includes('.') ? file.name.split('.').pop().toUpperCase() : 'FILE';
        mediaStageHtml = `
          <div class="generic-file-box">
            <svg class="generic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/>
            </svg>
            <div class="file-badge">${escapeHtml(ext)} DOCUMENT</div>
          </div>`;
      }

      appMain.innerHTML = `
        <div class="file-showcase">
          <h2 class="showcase-title">${escapeHtml(file.name)}</h2>
          ${mediaStageHtml}
          <div class="showcase-actions">
            <a href="${downloadUrl}" class="btn btn-primary">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
              Download (${formatSize(file.size)})
            </a>
            <button class="btn btn-secondary" onclick="copyToClipboard('${escapeJs(fullDirectUrl)}')">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
              </svg>
              Copy Link
            </button>
            ${isMedia ? `
              <button class="btn btn-secondary" onclick="openLightbox(0)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
                </svg>
                Fullscreen
              </button>
            ` : ''}
          </div>
        </div>
      `;
    }

    async function fetchTextPreview(url) {
      try {
        const resp = await fetch(url);
        const text = await resp.text();
        const el = document.getElementById('codePreview');
        if (el) el.textContent = text;
      } catch (e) {
        const el = document.getElementById('codePreview');
        if (el) el.textContent = 'Error loading text preview.';
      }
    }

    // Lightbox & File Interaction
    function onFileClick(relPath) {
      const idx = mediaList.findIndex(m => m.relPath === relPath);
      if (idx !== -1) {
        openLightbox(idx);
      } else {
        // Direct download for non-media files
        window.location.href = `/s/${token}/raw?download=1&p=${encodeURIComponent(relPath)}`;
      }
    }

    function openLightbox(idx) {
      if (!mediaList || mediaList.length === 0) return;
      if (idx < 0 || idx >= mediaList.length) return;
      currentLightboxIdx = idx;
      const file = mediaList[idx];
      const modal = document.getElementById('lightboxModal');
      const title = document.getElementById('lightboxTitle');
      const content = document.getElementById('lightboxContent');
      const downloadBtn = document.getElementById('lightboxDownloadBtn');
      const prevBtn = document.getElementById('lightboxPrevBtn');
      const nextBtn = document.getElementById('lightboxNextBtn');

      title.textContent = mediaList.length > 1 ? `${file.name} (${idx + 1}/${mediaList.length})` : file.name;
      downloadBtn.href = `/s/${token}/raw?download=1${file.relPath ? '&p=' + encodeURIComponent(file.relPath) : ''}`;

      prevBtn.style.display = mediaList.length > 1 ? 'flex' : 'none';
      nextBtn.style.display = mediaList.length > 1 ? 'flex' : 'none';

      const rawUrl = `/s/${token}/raw${file.relPath ? '?p=' + encodeURIComponent(file.relPath) : ''}`;
      const category = getFileType(file);
      if (category === 'image') {
        content.innerHTML = `<img src="${rawUrl}" alt="${escapeHtml(file.name)}">`;
      } else if (category === 'video') {
        content.innerHTML = `<video src="${rawUrl}" controls autoplay></video>`;
      }

      modal.classList.add('active');
    }

    function closeLightbox() {
      const modal = document.getElementById('lightboxModal');
      const content = document.getElementById('lightboxContent');
      modal.classList.remove('active');
      content.innerHTML = '';
      currentLightboxIdx = -1;
    }

    function lightboxPrev() {
      if (currentLightboxIdx > 0) openLightbox(currentLightboxIdx - 1);
    }

    function lightboxNext() {
      if (currentLightboxIdx < mediaList.length - 1) openLightbox(currentLightboxIdx + 1);
    }

    document.getElementById('lightboxCloseBtn').addEventListener('click', closeLightbox);
    document.getElementById('lightboxPrevBtn').addEventListener('click', lightboxPrev);
    document.getElementById('lightboxNextBtn').addEventListener('click', lightboxNext);

    document.addEventListener('keydown', (e) => {
      if (currentLightboxIdx !== -1) {
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') lightboxPrev();
        if (e.key === 'ArrowRight') lightboxNext();
      }
    });

    // Helper functions
    function formatSize(bytes) {
      if (!bytes || bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function formatDate(ts) {
      if (!ts) return '';
      const d = new Date(ts * 1000);
      return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeJs(str) {
      if (!str) return '';
      return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    // Initial boot
    loadShareInfo();
  </script>
</body>
</html>
