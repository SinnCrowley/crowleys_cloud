<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Crowley's Cloud - Shared Link</title>
  <link rel="icon" type="image/png" href="/public/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>
    :root {
      --font-sans: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'Fira Code', 'Roboto Mono', Consolas, monospace;

      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 18px;
      --radius-full: 9999px;

      --shadow-card: 0 10px 18px rgba(0, 0, 0, 0.28);
      --shadow-dropdown: 0 4px 12px rgba(0, 0, 0, 0.25);
    }

    /* Dark Theme (Default) */
    :root[data-theme="dark"], body.theme-dark {
      --bg-background: #1E1E1E;
      --bg-surface: #2C2C2C;
      --bg-surface-hover: #353535;
      --bg-input: #1E1E1E;
      --accent-color: #FA5252;
      --accent-hover: color-mix(in srgb, var(--accent-color) 85%, white);
      --text-main: #FFFFFF;
      --text-sub: #A0A0A0;
      --border-color: #3D3D3D;
      --selection-bg: color-mix(in srgb, var(--accent-color) 15%, transparent);
      --selection-border: var(--accent-color);
      --color-danger: #FF5252;
    }

    /* Light Theme */
    :root[data-theme="light"], body.theme-light {
      --bg-background: #F4F5F8;
      --bg-surface: #FFFFFF;
      --bg-surface-hover: #F8F9FA;
      --bg-input: #F4F5F8;
      --accent-color: #FA5252;
      --accent-hover: color-mix(in srgb, var(--accent-color) 88%, black);
      --text-main: #1F2937;
      --text-sub: #6B7280;
      --border-color: #E5E7EB;
      --selection-bg: color-mix(in srgb, var(--accent-color) 12%, transparent);
      --selection-border: var(--accent-color);
      --color-danger: #FF5252;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      overflow-x: hidden;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-background);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      margin: 0;
      padding: 0;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    /* Top Header Bar matching HeaderBar.svelte */
    header.header-bar {
      height: 64px;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      gap: 16px;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-main);
    }

    .brand-logo {
      height: 50px;
      max-height: 52px;
      width: auto;
      object-fit: contain;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent-color);
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .search-section {
      flex: 1;
      max-width: 440px;
    }

    .search-wrapper {
      position: relative;
      width: 100%;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-sub);
      pointer-events: none;
      font-size: 20px;
    }

    .search-pill {
      width: 100%;
      height: 40px;
      border-radius: var(--radius-full);
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      padding: 0 36px 0 44px;
      color: var(--text-main);
      outline: none;
      font-size: 13px;
      font-weight: 500;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .search-pill:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent-color) 20%, transparent);
    }

    .clear-search-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-sub);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      cursor: pointer;
    }

    .clear-search-btn:hover {
      color: var(--text-main);
      background-color: var(--bg-surface-hover);
    }

    .actions-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Buttons matching system .btn and .btn-icon */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: var(--radius-md);
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: background-color 0.15s ease, transform 0.1s ease;
      white-space: nowrap;
    }

    .btn-primary {
      background-color: var(--accent-color);
      color: #FFFFFF;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background-color: var(--bg-surface-hover);
    }

    .btn-icon {
      width: 36px;
      height: 36px;
      padding: 0;
      border-radius: var(--radius-full);
      background: transparent;
      color: var(--text-sub);
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .btn-icon:hover {
      background-color: var(--bg-surface-hover);
      color: var(--text-main);
    }

    .header-divider {
      width: 1px;
      height: 20px;
      background-color: var(--border-color);
      margin: 0 4px;
    }

    /* Main Container */
    main.main-content {
      flex: 1;
      width: 100%;
      padding: 24px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    /* Breadcrumbs matching BreadcrumbBar.svelte */
    .breadcrumb-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .crumb-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: none;
      color: var(--text-sub);
      font-size: 14px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .crumb-btn:hover {
      background-color: var(--bg-surface-hover);
      color: var(--text-main);
    }

    .crumb-btn.active {
      color: var(--accent-color);
      font-weight: 700;
      background-color: var(--selection-bg);
    }

    .crumb-separator {
      color: var(--text-sub);
      font-size: 16px;
      opacity: 0.5;
    }

    /* File Grid Layout matching FileGrid.svelte */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      overflow-y: auto;
      flex: 1;
      align-content: start;
      padding-bottom: 32px;
    }

    .grid-item {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      aspect-ratio: 1 / 1.12;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.1s ease, border-color 0.1s ease;
      min-width: 0;
      position: relative;
    }

    .grid-item:hover {
      background-color: var(--bg-surface-hover);
      border-color: var(--accent-color);
    }

    .grid-item-thumbnail {
      width: 100%;
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: var(--radius-md);
      background-color: var(--bg-background);
      margin-bottom: 8px;
    }

    .grid-item-thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .grid-item-icon {
      font-size: 52px;
      color: var(--text-sub);
    }

    .grid-item-icon.icon-folder {
      color: var(--accent-color);
    }

    .grid-item-info {
      width: 100%;
    }

    .grid-item-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      text-align: left;
    }

    .grid-item-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-top: 4px;
      height: 24px;
    }

    .grid-item-meta {
      font-size: 11px;
      color: var(--text-sub);
    }

    .grid-item-action-btn {
      width: 24px;
      height: 24px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-sub);
      transition: background-color 0.15s ease, color 0.15s ease;
      text-decoration: none;
    }

    .grid-item-action-btn:hover {
      background-color: var(--bg-background);
      color: var(--accent-color);
    }

    /* File List Layout matching FileList.svelte */
    .list-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
      flex: 1;
      padding-bottom: 32px;
    }

    .list-header {
      display: grid;
      grid-template-columns: 48px 4.5fr 2fr 2fr 60px;
      gap: 12px;
      padding: 12px 16px;
      color: var(--text-sub);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 8px;
    }

    .list-row {
      display: grid;
      grid-template-columns: 48px 4.5fr 2fr 2fr 60px;
      gap: 12px;
      padding: 12px 16px;
      align-items: center;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .list-row:hover {
      background-color: var(--bg-surface-hover);
      border-color: var(--accent-color);
    }

    .list-icon {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .file-type-icon {
      font-size: 20px;
      color: var(--accent-color);
    }

    .list-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .list-size, .list-date {
      font-size: 13px;
      color: var(--text-sub);
      text-align: right;
    }

    .list-action {
      display: flex;
      justify-content: flex-end;
    }

    /* Single File Showcase Card */
    .file-showcase {
      max-width: 860px;
      width: 100%;
      margin: 20px auto;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      box-shadow: var(--shadow-card);
    }

    .showcase-title {
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      color: var(--text-main);
      word-break: break-word;
    }

    .preview-stage {
      width: 100%;
      max-height: 60vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      border-radius: var(--radius-lg);
      background-color: var(--bg-background);
      border: 1px solid var(--border-color);
      cursor: pointer;
      position: relative;
    }

    .preview-stage img {
      max-width: 100%;
      max-height: 60vh;
      object-fit: contain;
      border-radius: var(--radius-md);
    }

    .preview-stage video {
      max-width: 100%;
      max-height: 60vh;
      outline: none;
      border-radius: var(--radius-md);
    }

    .audio-stage {
      width: 100%;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      background-color: var(--bg-background);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
    }

    .audio-stage audio {
      width: 100%;
      max-width: 480px;
    }

    .code-container {
      width: 100%;
      max-height: 55vh;
      overflow: auto;
      background-color: #121316;
      color: #E2E8F0;
      padding: 20px;
      border-radius: var(--radius-lg);
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-all;
      border: 1px solid var(--border-color);
    }

    .generic-file-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 48px 20px;
      text-align: center;
      background-color: var(--bg-background);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      width: 100%;
    }

    .generic-icon {
      font-size: 64px;
      color: var(--accent-color);
    }

    .file-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 14px;
      background-color: var(--selection-bg);
      color: var(--accent-color);
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .showcase-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      width: 100%;
    }

    /* Lightbox Modal matching MediaPreviewModal.svelte */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background-color: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .lightbox.active {
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox-header {
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.4);
    }

    .lightbox-title {
      font-size: 16px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 60vw;
    }

    .lightbox-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
      position: relative;
    }

    .lightbox-content {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .lightbox-content img, .lightbox-content video {
      max-width: 90vw;
      max-height: 80vh;
      object-fit: contain;
      border-radius: var(--radius-md);
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.8);
    }

    .lightbox-nav {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      width: 44px;
      height: 44px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease;
      z-index: 10;
      flex-shrink: 0;
    }

    .lightbox-nav:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    /* Text Preview Modal */
    .text-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background-color: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      padding: 24px;
    }

    .text-modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .text-modal-header {
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #ffffff;
      background: var(--bg-surface);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      border: 1px solid var(--border-color);
      border-bottom: none;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    .text-modal-title {
      font-size: 16px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .text-modal-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      min-height: 0;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 0 0 var(--radius-lg) var(--radius-lg);
      padding: 16px;
      overflow: hidden;
    }

    .text-modal-body .code-container {
      width: 100%;
      height: 100%;
      max-height: 100%;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 2000;
      background-color: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 12px 20px;
      border-radius: var(--radius-full);
      box-shadow: var(--shadow-card);
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.2s ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Loading Spinner & Empty state */
    .spinner-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 300px;
      gap: 16px;
      color: var(--text-sub);
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border-color);
      border-top-color: var(--accent-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 20px;
      text-align: center;
      width: 100%;
    }

    .empty-icon {
      font-size: 56px;
      color: var(--text-sub);
      opacity: 0.5;
      margin-bottom: 12px;
    }

    .empty-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .empty-sub {
      font-size: 13px;
      color: var(--text-sub);
    }

    @media (max-width: 768px) {
      header.header-bar {
        padding: 0 16px;
      }
      .search-section {
        display: none;
      }
      .list-header {
        display: none;
      }
      .list-row {
        grid-template-columns: 40px 1fr 40px;
      }
      .list-size, .list-date {
        display: none;
      }
    }

    @media (max-width: 640px) {
      header.header-bar {
        padding: 0 10px;
        gap: 8px;
      }
      .brand {
        gap: 6px;
      }
      .brand-logo {
        height: 42px;
      }
      .actions-section {
        gap: 6px;
      }
      .header-divider {
        display: none;
      }
      .btn-primary {
        padding: 6px 12px;
        font-size: 13px;
      }
      .file-showcase {
        padding: 20px;
        gap: 16px;
      }
      .showcase-title {
        font-size: 18px;
      }
      .showcase-actions {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }
      .showcase-actions .btn {
        width: 100%;
        justify-content: center;
      }
    }

    @media (max-width: 440px) {
      .brand-title {
        font-size: 13px;
      }
      .download-text {
        display: none;
      }
      .btn-primary {
        padding: 8px;
        border-radius: var(--radius-full);
        width: 36px;
        height: 36px;
      }
      .text-modal {
        padding: 12px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Header Bar -->
  <header class="header-bar">
    <a href="#" class="brand">
      <img src="/public/logo_horizontal.png" class="brand-logo" alt="Crowley's Cloud Logo">
    </a>

    <!-- Live Search Pill Input -->
    <div class="search-section">
      <div class="search-wrapper">
        <label for="searchInput" class="visually-hidden">Filter files</label>
        <span class="material-symbols-outlined search-icon">search</span>
        <input
          type="text"
          class="search-pill"
          id="searchInput"
          placeholder="Filter files..."
          aria-label="Filter files"
        />
        <button
          type="button"
          class="clear-search-btn"
          id="clearSearchBtn"
          style="display:none;"
        >
          <span class="material-symbols-outlined" style="font-size: 16px;">close</span>
        </button>
      </div>
    </div>

    <!-- Actions & Toolbar -->
    <div class="actions-section">
      <!-- Layout View Toggle Button -->
      <button
        class="btn-icon"
        id="layoutToggleBtn"
        title="Toggle Grid / List View"
      >
        <span class="material-symbols-outlined" id="layoutIcon">grid_view</span>
      </button>

      <div class="header-divider"></div>

      <!-- Theme Switcher Button -->
      <button
        class="btn-icon"
        id="themeToggleBtn"
        title="Toggle Light / Dark Mode"
      >
        <span class="material-symbols-outlined" id="themeIcon">light_mode</span>
      </button>

      <!-- Main Download Button -->
      <a href="#" class="btn btn-primary" id="mainDownloadBtn">
        <span class="material-symbols-outlined" style="font-size: 18px;">download</span>
        <span id="downloadBtnText" class="download-text">Download</span>
      </a>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="main-content" id="appMain">
    <div class="spinner-container">
      <div class="spinner"></div>
      <p class="text-sub">Loading shared resource...</p>
    </div>
  </main>

  <!-- Fullscreen Lightbox Modal for Photos/Videos -->
  <div class="lightbox" id="lightboxModal">
    <div class="lightbox-header">
      <span class="lightbox-title" id="lightboxTitle">Preview</span>
      <div style="display:flex; gap:10px;">
        <a href="#" class="btn-icon" id="lightboxDownloadBtn" title="Download" style="color:#fff;">
          <span class="material-symbols-outlined">download</span>
        </a>
        <button class="btn-icon" id="lightboxCloseBtn" title="Close (Esc)" style="color:#fff;">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
    </div>
    <div class="lightbox-body">
      <button class="lightbox-nav" id="lightboxPrevBtn" title="Previous">
        <span class="material-symbols-outlined">chevron_left</span>
      </button>
      <div class="lightbox-content" id="lightboxContent"></div>
      <button class="lightbox-nav" id="lightboxNextBtn" title="Next">
        <span class="material-symbols-outlined">chevron_right</span>
      </button>
    </div>
  </div>

  <!-- Text Viewer Modal for Code / Text Files -->
  <div class="text-modal" id="textModal">
    <div class="text-modal-header">
      <div style="display:flex; align-items:center; gap:8px;">
        <span class="material-symbols-outlined" style="color:var(--accent-color);">article</span>
        <span class="text-modal-title" id="textModalTitle">Text Preview</span>
      </div>
      <div style="display:flex; gap:10px;">
        <a href="#" class="btn-icon" id="textModalDownloadBtn" title="Download" style="color:#fff;">
          <span class="material-symbols-outlined">download</span>
        </a>
        <button class="btn-icon" id="textModalCloseBtn" title="Close (Esc)" style="color:#fff;">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
    </div>
    <div class="text-modal-body">
      <div class="code-container" id="textModalContent">Loading content...</div>
    </div>
  </div>

  <!-- Toast Message -->
  <div class="toast" id="toast">Copied to clipboard!</div>

  <script src="/public/share.js" defer></script>
</body>
</html>
